<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>双刃 · 双页自测</title>
<style>
  body { margin: 0; padding: 10px; background: #0b0f14; color: #cfe0f0; font: 12px/1.6 Consolas, monospace; }
  #log { white-space: pre-wrap; background: #0d141c; border: 1px solid #1e2a36; padding: 10px; border-radius: 6px; min-height: 260px; }
  #frames { display: flex; gap: 8px; margin-top: 8px; }
  iframe { width: 480px; height: 360px; border: 1px solid #22303d; background: #000; }
</style>
</head>
<body>
<pre id="log">boot…</pre>
<div id="frames"></div>
<script>
const out = document.getElementById('log');
function log() {
  const s = [...arguments].map((a) => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
  out.textContent += '\n' + s;
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

function mk(src) {
  const f = document.createElement('iframe');
  f.allow = 'autoplay; fullscreen; camera; microphone';
  f.src = src;
  document.getElementById('frames').appendChild(f);
  return new Promise((res) => {
    f.onload = () => res(f);
    setTimeout(() => res(f), 15000);
  });
}

function clickEverything(doc) {
  const btns = [...doc.querySelectorAll('button, a, [role=button], div[id]')];
  let n = 0;
  for (const b of btns) {
    const t = (b.textContent || '').trim();
    if (b.tagName === 'DIV' && t.length > 20) continue;
    try { b.click(); n++; } catch (e) {}
  }
  return n;
}

(async () => {
  out.textContent = 'boot…';
  log('=== 1. 开房页 ===');
  const hf = await mk('host3.html?p=1');
  await wait(1200);
  const hd = hf.contentDocument;
  log('title:', hd.title);
  log('文字:', (hd.body.innerText || '').replace(/\n/g, ' | ').slice(0, 160));
  log('点击元素数:', clickEverything(hd));

  let room = null;
  for (let i = 0; i < 20; i++) {
    await wait(800);
    const t = hd.body.innerText || '';
    const m = t.match(/\bde[0-9a-z]{5,9}\b/i);
    if (m) { room = m[0]; break; }
    const urlm = hf.contentWindow.location.search.match(/room=([0-9a-zA-Z]+)/);
    if (urlm) { room = urlm[1]; break; }
  }
  log('房号:', room);
  log('房主诊断:', ((hd.body.innerText || '').match(/房号[\s\S]{0,160}/) || ['(无)'])[0].replace(/\n/g, ' | '));

  if (!room) { log('!! 房主没出房号，停止'); return; }

  log('=== 2. 手机页 ===');
  const jf = await mk('phone.html?room=' + encodeURIComponent(room));
  await wait(1500);
  const jd = jf.contentDocument;
  log('title:', jd.title);
  log('文字:', (jd.body.innerText || '').replace(/\n/g, ' | ').slice(0, 160));
  log('点击元素数:', clickEverything(jd));

  for (let i = 0; i < 16; i++) {
    await wait(1200);
    const v = jd.getElementById('rv');
    const st = {
      tag: !!v,
      display: v ? v.style.display : null,
      w: v ? v.videoWidth : null,
      h: v ? v.videoHeight : null,
      paused: v ? v.paused : null,
      ready: v ? v.readyState : null,
      t: v ? Math.round((v.currentTime || 0) * 100) / 100 : null,
      muted: v ? v.muted : null,
      hasStream: v && v.srcObject ? v.srcObject.getTracks().map((t) => t.kind + ':' + t.readyState).join(',') : null,
    };
    const bodyTxt = (jd.body.innerText || '').replace(/\n/g, ' | ').slice(0, 120);
    log('#' + i, st, '|', bodyTxt);
    if (v && v.videoWidth > 0 && v.currentTime > 0) { log('OK 收到画面了'); break; }
  }

  const v2 = jd.getElementById('rv');
  if (v2 && v2.peerConnection === undefined) {
    const pc = jf.contentWindow.__npCall && jf.contentWindow.__npCall.peerConnection;
    if (pc) {
      log('ICE:', pc.iceConnectionState, '| signaling:', pc.signalingState, '| remoteSet:', !!pc.remoteDescription);
    } else {
      log('no pc');
    }
  }
  log('=== 完 ===');
})();
</script>
</body>
</html>
