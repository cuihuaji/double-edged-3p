<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<title>Double Edged · 房主</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #07090c; overflow: hidden;
    font: 13px/1.6 "Microsoft YaHei", system-ui, sans-serif; color: #cfd6df; }

  #wrap { position: absolute; inset: 0; }
  /* 固定 880x640：AVM 按 iframe 内部视口决定画布像素和舞台比例，
     两端视口一样大，命中判定用的包围盒才会一样。
     外层用 transform 放大显示，缩放不影响内部视口。 */
  #game {
    position: absolute; left: 50%; top: 50%;
    width: 880px; height: 640px; border: 0; display: block;
    pointer-events: none; transform-origin: center center;
    transform: translate(-50%, -50%);
  }
  /* 覆盖层接管鼠标，游戏本身收不到原生点击 */
  #clicklayer { position: absolute; inset: 0; cursor: crosshair; }

  #panel {
    position: absolute; top: 14px; right: 14px; width: 330px; padding: 14px 16px;
    background: rgba(14, 18, 24, .94); border: 1px solid #232a34; border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6); z-index: 20;
  }
  #panel h1 { font-size: 14px; font-weight: 600; color: #e8eef5; margin-bottom: 10px; }
  /* 面板收起：只留右上角一个小把手，不挡画面 */
  #panel h1 { display: flex; align-items: center; justify-content: space-between; }
  #collapse {
    width: auto; margin: 0; padding: 2px 8px; font-size: 11px; line-height: 1.4;
    background: #1b2430; color: #9fb0c2; border: 1px solid #2c3846; border-radius: 6px; cursor: pointer;
  }
  #panel.min { width: auto; padding: 6px; border-radius: 8px; }
  #panel.min > *:not(#handle) { display: none !important; }
  #handle {
    display: none; cursor: pointer; font-size: 12px; color: #9fb0c2;
    padding: 4px 10px; user-select: none;
  }
  #panel.min #handle { display: block; }

  .row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 12px; }
  .k { color: #7c8794; }
  .v { color: #cfd6df; font-variant-numeric: tabular-nums; }
  .ok { color: #5fd08a; } .bad { color: #e0705a; }

  .room {
    margin-top: 10px; padding: 10px; text-align: center; letter-spacing: 3px;
    font: 600 22px/1.2 Consolas, monospace; color: #9fd4ff;
    background: #0b0f14; border: 1px dashed #2c3846; border-radius: 8px; cursor: pointer;
  }
  textarea {
    width: 100%; height: 60px; margin-top: 8px; padding: 6px 8px; resize: none;
    background: #0b0f14; color: #9fb0c2; border: 1px solid #232a34; border-radius: 6px;
    font: 11px/1.4 Consolas, monospace; word-break: break-all;
  }
  button {
    width: 100%; margin-top: 8px; padding: 8px; cursor: pointer;
    background: #1b2430; color: #d6e2ef; border: 1px solid #2c3846; border-radius: 6px; font-size: 13px;
  }
  button:hover { background: #23303f; }
  button:disabled { opacity: .45; cursor: default; }
  details.alt { margin-top: 10px; font-size: 11px; color: #61707f; }
  details.alt summary { cursor: pointer; padding: 4px 0; }
  .hint { margin-top: 8px; font-size: 11px; color: #61707f; line-height: 1.5; }
  code { color: #8ab4d8; }
</style>
</head>
<body>
<div id="wrap"><iframe id="game" allow="autoplay; fullscreen"></iframe></div>
<div id="clicklayer"></div>

<div id="panel">
  <h1>双人/三人联机 · 房主（P1）</h1>
  <div class="row"><span class="k">游戏</span><span class="v" id="v-game">载入中…</span></div>
  <div class="row"><span class="k">对端</span><span class="v" id="v-peer">未连接</span></div>
  <div class="row"><span class="k">帧号</span><span class="v" id="v-frame">0</span></div>
  <div class="row"><span class="k">帧率</span><span class="v" id="v-fps">0 fps</span></div>
  <div class="row"><span class="k">往返</span><span class="v" id="v-rtt">-- ms</span></div>
  <div class="row"><span class="k">一致性</span><span class="v" id="v-sync">—</span></div>
  <div class="row"><span class="k">画布</span><span class="v" id="v-canvas">—</span></div>
  <div class="row"><span class="k">状态指纹</span><span class="v" id="v-state">—</span></div>
  <div class="row"><span class="k">随机数调用</span><span class="v" id="v-rng">—</span></div>
  <div class="row"><span class="k">输入延迟</span><span class="v" id="v-delay">—</span></div>

  <div class="room" id="room">点这里开房</div>
  <div class="hint" id="room-hint">开房后把房间号发给好友，他输入就能进。</div>

  <details class="alt">
    <summary>备用：手动连接码（信令连不上时用）</summary>
    <button id="btn-offer">生成邀请码</button>
    <textarea id="offer" readonly placeholder="生成后出现，发给好友"></textarea>
    <textarea id="answer" placeholder="把好友回传的回应码粘到这里"></textarea>
    <button id="btn-answer" disabled>接收回应 · 开局</button>
  </details>

  <div class="hint">
    你玩 <code>↑←↓→</code> 移动 · <code>N</code> 攻击 · <code>M</code> 跳。菜单只能你点。
  </div>
</div>

<script src="../net2/common.js"></script>
<script src="peerjs.min.js"></script>
<script src="diag.js"></script>
<script src="subs.js"></script>
<script src="lock.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const iframe = $("game");

  // 房间号即种子：de + 36 进制种子，好友从房间号里直接解析出同一个随机种子
  let SEED = (Math.random() * 0x7fffffff) >>> 0;

  // 信令走 PeerJS 公网云（wss://0.peerjs.com:443），不再依赖房主本机的 PeerServer。
  // 这样页面挂到任何公网地址（https 隧道也好、别的托管也好）好友都能发房号、能连。
  const PEER_OPTS = {
    debug: 0,
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:global.stun.twilio.com:3478" }
      ]
    }
  };

  iframe.src = "../html5/play3p.html?seed=" + SEED;

  const lock = new Lock({
    side: "p1", seed: SEED, frame: iframe, expectPeers: (parseInt(new URLSearchParams(location.search).get("p") || "2", 10) || 2),
    log: (m) => console.log("[lock]", m),
    diag: (c, m, d, s) => window.__diag && window.__diag.report(c, m, d, s)
  });

  /* 让 iframe 显示尺寸跟随窗口，但内部视口恒为 880x640 */
  function fitIframe() {
    const k = Math.min(window.innerWidth / 880, window.innerHeight / 640);
    iframe.style.transform = "translate(-50%, -50%) scale(" + Math.max(0.3, k) + ")";
  }
  window.addEventListener("resize", fitIframe);
  fitIframe();

  /* ---------- 状态指纹比对 ----------
     两端各自在 AS3 里算「玩家坐标/血量 + 敌人坐标/血量 + 人数」的指纹，
     每 10 个游戏帧上报一次到服务器（房主 slot=1，好友 slot=2）。
     这里只在两端报的是同一帧号时才比较，避免帧错位造成误报。 */
  const st = { lastF: 0, same: 0, diff: 0, last: "" };
  async function pollHashes() {
    try {
      const d = await fetch("/api/hashes").then((r) => r.json());
      const a = d["1"], b = d["2"];
      if (!a || !b) return;
      if (a.f !== b.f || a.f === 0) { $("v-state").textContent = "等两端同步（" + a.f + "/" + b.f + "）"; return; }
      if (a.f === st.lastF) return;
      st.lastF = a.f;
      if (a.h === b.h) {
        st.same++;
        $("v-state").textContent = "一致 f=" + a.f;
        $("v-state").className = "v ok";
      } else {
        st.diff++;
        st.last = "f=" + a.f + " 本端 " + a.h + " / 对端 " + b.h;
        $("v-state").textContent = "偏离 " + st.diff + " 次";
        $("v-state").className = "v bad";
        if (window.__diag) {
          window.__diag.report("state", "第 " + a.f + " 帧游戏状态不一致", st.last, "err");
        }
      }
    } catch (e) {}
  }
  setInterval(pollHashes, 250);

  /* 两端随机数调用次数：若不一致，说明随机数流已错位，必然后面全部分叉 */
  async function pollRng() {
    try {
      const d = await fetch("/api/rng").then((r) => r.json());
      const a = d["1"], b = d["2"];
      if (!a || !b) return;
      // 两端帧号不同时不做结论（只是采样时刻不同，不是错位）
      if (a.f !== b.f || !a.f) {
        $("v-rng").textContent = "同步中（" + a.f + "/" + b.f + "）";
        return;
      }
      const same = a.n === b.n;
      $("v-rng").textContent = a.n + " / " + b.n + (same ? "" : "（差 " + (a.n - b.n) + "）");
      $("v-rng").className = "v " + (same ? "ok" : "bad");
    } catch (e) {}
  }
  setInterval(pollRng, 500);

  /* ---------- 状态面板 ---------- */
  setInterval(() => {
    const L = lock.L;
    $("v-game").textContent = L ? (L.started ? "就绪" : "载入中") : "载入中";
    $("v-game").className = "v" + (L && L.started ? " ok" : "");
    const open = !!lock.transport || !!(lock.dc && lock.dc.readyState === "open");
    $("v-peer").textContent = open ? (lock.started ? "已连接 · 锁步中" : "已连接") : "未连接";
    $("v-peer").className = "v" + (open ? " ok" : "");
    $("v-frame").textContent = lock.next;
    $("v-fps").textContent = lock.stats.fps + " fps";
    $("v-rtt").textContent = (lock.stats.rtt || "--") + " ms";
    $("v-sync").textContent = lock.desync
      ? ("偏离 " + lock.desync + " 次" + (lock.desyncKind ? "（" + lock.desyncKind + "）" : ""))
      : "一致";
    $("v-sync").className = "v " + (lock.desync ? "bad" : "ok");
    $("v-canvas").textContent = lock.canvasSize();
    $("v-delay").textContent = Math.round(lock.delay / 30 * 1000) + " ms";
  }, 300);

  /* ---------- PeerJS：短房号 ---------- */
  function bindConn(conn) {
    const adapter = {
      _q: [],
      send: (o) => { if (conn.open) { try { conn.send(o); } catch (e) {} } else adapter._q.push(o); },
      ready: conn.open
    };
    lock.attachTransport(adapter);
    conn.on("open", () => { adapter.ready = true; const q = adapter._q.splice(0); q.forEach((o) => { try { conn.send(o); } catch (e) {} }); adapter.onopen && adapter.onopen(); });
    conn.on("data", (d) => adapter.onmessage && adapter.onmessage(d));
    conn.on("close", () => { adapter.ready = false; adapter.onclose && adapter.onclose(); });
    conn.on("error", (e) => window.__diag && window.__diag.report("dc", "PeerJS 连接出错",
      String((e && e.type) || e), "err"));
    if (conn.open) setTimeout(() => { adapter.ready = true; adapter.onopen && adapter.onopen(); }, 0);
  }

  let peer = null;
  let roomId = null;      /* 房号：de + 种子36进制 + "-" + 4位随机后缀，避开公网云 id 撞车 */
  let openTries = 0;

  function salt4() {
    const A = "abcdefghijklmnopqrstuvwxyz0123456789";
    let t = "";
    for (let i = 0; i < 4; i++) t += A[(Math.random() * A.length) | 0];
    return t;
  }

  function openRoom() {
    roomId = "de" + SEED.toString(36) + "-" + salt4();
    $("room").textContent = "连接信令…";
    try { if (peer) peer.destroy(); } catch (e) {}
    peer = new Peer(roomId, PEER_OPTS);

    peer.on("open", () => {
      $("room").textContent = roomId;
      $("room-hint").textContent = (lock.expectPeers === 1 ? "已复制。双人房：1 位好友加入即开局（WASD）。" : "已复制，发给好友即可。两个好友都加入后开局。");
      navigator.clipboard.writeText(roomId).catch(() => {});
    });
    peer.on("connection", bindConn);
    peer.on("error", (e) => {
      const t = (e && e.type) || String(e);
      // id 撞车 / 信令抖动：换个后缀重开，最多 6 次
      if ((t === "unavailable-id" || t === "network" || t === "server-error") && openTries < 6) {
        openTries++;
        $("room").textContent = "信令重试 " + openTries + "…";
        $("room-hint").textContent = "公网信令一时连不上，正在重试（" + t + "）。";
        setTimeout(openRoom, 900 * openTries);
        return;
      }
      $("room").textContent = "开房失败";
      $("room-hint").textContent = "错误：" + t + "（检查网络是否能访问 0.peerjs.com）";
      if (window.__diag) window.__diag.report("dc", "PeerJS 开房失败", t, "err");
    });
  }

  $("room").addEventListener("click", () => {
    if (peer) {
      navigator.clipboard.writeText(roomId || $("room").textContent).catch(() => {});
      $("room-hint").textContent = "已复制，发给好友即可。";
      return;
    }
    openRoom();
  });

  /* ---------- 备用：手动连接码 ---------- */
  $("btn-offer").addEventListener("click", async () => {
    $("btn-offer").disabled = true;
    $("btn-offer").textContent = "正在收集候选地址…";
    const code = await lock.createOffer();
    $("offer").value = "O." + SEED.toString(36) + "." + code;
    $("btn-offer").textContent = "已生成，发给好友";
    $("btn-answer").disabled = false;
  });

  $("btn-answer").addEventListener("click", async () => {
    const v = $("answer").value.trim();
    if (!v) return;
    $("btn-answer").disabled = true;
    try {
      await lock.acceptAnswer(v.replace(/^A\.[^.]*\./, ""));
      $("btn-answer").textContent = "已接入，等开局";
    } catch (e) {
      $("btn-answer").disabled = false;
      $("btn-answer").textContent = "回应码无效，重试";
    }
  });

  /* 测试接口 */
  window.__np = {
    lock: lock,
    seed: SEED,
    get roomId() { return roomId; },
    get peerOpen() { return !!(peer && peer.open); },
    createOffer: () => lock.createOffer().then((c) => "O." + SEED.toString(36) + "." + c),
    acceptAnswer: (v) => lock.acceptAnswer(v.replace(/^A\.[^.]*\./, ""))
  };
})();

  /* ---------- 内置监听器：面板底部实时显示锁步卡点 ---------- */
  (function mon() {
    let box = document.getElementById("v-mon");
    if (!box) {
      box = document.createElement("div");
      box.id = "v-mon";
      box.style.cssText = "margin-top:8px;padding-top:8px;border-top:1px solid #232a34;font-size:11px;line-height:1.5;color:#8fa3b8;white-space:pre-wrap;word-break:break-all;";
      const panel = document.getElementById("panel");
      if (panel) panel.appendChild(box);
    }
    const t0 = Date.now();
    const last = { k: "" };
    window.__monTimer = setInterval(function () {
      const L = window.__np && window.__np.lock;
      if (!L) { box.textContent = "监听: 未找到 lock"; return; }
      const il = L.L;
      let tip;
      const st = "t=" + ((Date.now() - t0) / 1000 | 0) + "s next=" + L.next + " linked=" + !!L.linked
        + " peerReady=" + !!L.peerReady + " started=" + !!L.started
        + " tp=" + (L.transports ? L.transports.length + "/" + (L._readyCount ? L._readyCount() : "?") : 0)
        + " game=" + (il ? (il.started ? "ok" : il.phase) : "no-lock");
      if (!L.linked) tip = "卡点: P2P未连通(ready/expect不足)";
      else if (!L.peerReady) tip = "卡点: rd互报未完成(对端未宣告)";
      else if (!il || !il.started) tip = "卡点: 游戏载入回调未触发";
      else if (!L.started) tip = "卡点: _maybeStart差最后一环";
      else if (L.next === 0) tip = "卡点: 闸门未开 own0=" + (L.own && L.own.has(0)) + " rem0=" + (L.rem && L.rem.has(0));
      else tip = "✓ 锁步推进中";
      const key = L.next + "|" + tip;
      if (key !== last.k) {
        box.textContent = st + "\n" + tip;
        box.style.color = tip.charAt(0) === "✓" ? "#4caf50" : "#ff9800";
        last.k = key;
      }
    }, 500);
})();

  /* ---------- 面板收起 / 展开 ---------- */
  (function panelToggle() {
    const panel = document.getElementById("panel");
    if (!panel) return;
    const h1 = panel.querySelector("h1");
    const btn = document.createElement("button");
    btn.id = "collapse";
    btn.textContent = "收起";
    h1.appendChild(btn);

    const handle = document.createElement("div");
    handle.id = "handle";
    handle.textContent = "☰ 面板";
    panel.insertBefore(handle, panel.firstChild);

    function setMin(min) {
      panel.classList.toggle("min", min);
      try { localStorage.setItem("de_panel_min", min ? "1" : "0"); } catch (e) {}
    }
    btn.addEventListener("click", (e) => { e.stopPropagation(); setMin(true); });
    handle.addEventListener("click", () => setMin(false));
    try { if (localStorage.getItem("de_panel_min") === "1") setMin(true); } catch (e) {}

    // 快捷键 ` （反引号）切换
    window.addEventListener("keydown", (e) => {
      if (e.code === "Backquote") { e.preventDefault(); setMin(!panel.classList.contains("min")); }
    });
  })();

  /* ---------- 中文对照卡（F1） ---------- */
  (function zhCard() {
    const box = document.createElement("div");
    box.id = "zhcard";
    box.innerHTML = ''
      + '<h2>菜单文字对照（游戏本体是嵌入字体，无法直接改成中文）</h2>'
      + '<table>'
      + '<tr><td class="e">PLAY</td><td>开始游戏</td></tr>'
      + '<tr><td class="e">1 PLAYER / 2 PLAYERS</td><td>单人 / 双人</td></tr>'
      + '<tr><td class="e">MAP（地图上闪光的 PLAY）</td><td>关卡选择，点它进关</td></tr>'
      + '<tr><td class="e">HELP / CREDITS</td><td>操作说明 / 制作名单</td></tr>'
      + '<tr><td class="e">REDEFINE KEYS</td><td>自定义按键</td></tr>'
      + '<tr><td class="e">P1：←↑↓→ · N · M</td><td>移动 · 攻击/对话 · 跳跃</td></tr>'
      + '<tr><td class="e">P2：WASD · G · H</td><td>移动 · 攻击/对话 · 跳跃</td></tr>'
      + '</table>'
      + '<div class="tip">F1 开关 · 按 ` 收起右上角面板 · 游戏内对话是英文，暂无中文</div>';
    document.body.appendChild(box);

    const st = document.createElement("style");
    st.textContent = "  /* 中文对照卡（F1 开关） */\n  #zhcard {\n    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);\n    display: none; z-index: 30; width: min(620px, 92vw);\n    background: rgba(10, 14, 19, .95); border: 1px solid #2c3846; border-radius: 10px;\n    padding: 14px 18px; box-shadow: 0 18px 50px rgba(0,0,0,.65);\n    font-size: 12px; line-height: 1.9; color: #cfd6df;\n  }\n  #zhcard h2 { font-size: 13px; color: #e8eef5; margin-bottom: 6px; font-weight: 600; }\n  #zhcard table { width: 100%; border-collapse: collapse; }\n  #zhcard td { padding: 1px 0; vertical-align: top; }\n  #zhcard td.e { color: #9fd4ff; width: 46%; font-family: Consolas, monospace; }\n  #zhcard .tip { margin-top: 8px; color: #6f7d8c; font-size: 11px; }\n";
    document.head.appendChild(st);

    window.addEventListener("keydown", (e) => {
      if (e.code === "F1") {
        e.preventDefault();
        const on = box.style.display === "block";
        box.style.display = on ? "none" : "block";
      }
    });
  })();

  /* ---------- 中文字幕条 ---------- */
  (function subtitles() {
    const bar = document.createElement("div");
    bar.id = "subs";
    bar.innerHTML = '<div class="cn"></div><div class="en"></div>';
    document.body.appendChild(bar);

    const st = document.createElement("style");
    st.textContent = [
      "#subs{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);",
      "max-width:min(760px,88vw);display:none;z-index:25;text-align:center;",
      "padding:10px 22px;border-radius:12px;background:rgba(8,11,15,.82);",
      "border:1px solid rgba(120,140,160,.25);box-shadow:0 10px 30px rgba(0,0,0,.55);",
      "backdrop-filter:blur(3px);pointer-events:none;}",
      "#subs .cn{font-size:19px;line-height:1.55;color:#f2f6fa;letter-spacing:.5px;",
      "text-shadow:0 2px 6px rgba(0,0,0,.8);}",
      "#subs .en{font-size:11px;line-height:1.5;color:#7f8d9c;margin-top:5px;",
      "font-family:Consolas,monospace;letter-spacing:.2px;}"
    ].join("");
    document.head.appendChild(st);

    let last = "";
    let lastAt = 0;

    async function poll() {
      try {
        const d = await fetch("/api/say").then((r) => r.json());
        const raw = d && d.t;
        if (!raw) return;
        if (raw !== last) {
          last = raw;
          lastAt = Date.now();
          const zh = window.DE_LOOKUP ? window.DE_LOOKUP(raw) : "";
          const cn = bar.querySelector(".cn");
          const en = bar.querySelector(".en");
          if (zh) {
            cn.textContent = zh;
            en.textContent = raw.replace(/<br\s*\/?>/gi, " · ").replace(/\^/g, " · ");
            bar.style.display = "block";
          } else {
            // 没有译文的句子就原样显示，避免"吞字幕"
            cn.textContent = "";
            en.textContent = window.DE_NORM ? window.DE_NORM(raw).toLowerCase() : raw;
            bar.style.display = "block";
          }
        } else if (Date.now() - lastAt > 7000) {
          bar.style.display = "none";   // 句子该消失了
        }
      } catch (e) {}
    }
    setInterval(poll, 300);
  })();
</script>
</body>
</html>
