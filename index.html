<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>联机大厅</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 25%, #1c2733 0%, #0b0f14 70%);
    color: #e8eef6; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  .wrap { width: 640px; max-width: 92vw; padding: 34px 28px 28px; }
  h1 { margin: 0 0 6px; font-size: 25px; letter-spacing: 2px; }
  .sub { color: #8fa3b8; font-size: 13px; line-height: 1.7; margin-bottom: 22px; }

  .game {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 18px; margin-bottom: 14px; border-radius: 13px;
    background: #16202b; border: 1px solid #263545;
  }
  .game .meta { flex: 1; min-width: 0; }
  .game .name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .game .desc { font-size: 12px; color: #8fa3b8; line-height: 1.6; }
  .game .tag {
    display: inline-block; margin-left: 7px; padding: 1px 7px; border-radius: 5px;
    font-size: 10.5px; font-weight: 400; vertical-align: 2px;
    background: #223040; color: #8fa3b8; letter-spacing: .5px;
  }
  .game .acts { display: flex; flex-direction: column; gap: 7px; flex: 0 0 auto; }
  .btn {
    display: block; min-width: 92px; padding: 9px 14px; border-radius: 8px; text-align: center;
    text-decoration: none; font-size: 13px; border: 1px solid transparent; cursor: pointer;
    font-family: inherit; transition: .15s;
  }
  .btn.host { background: linear-gradient(180deg,#2f9a63,#1f7a4c); color: #fff; }
  .btn.host:hover { filter: brightness(1.12); }
  .btn.join { background: #1d2a38; border-color: #3f5b78; color: #cfe0f0; }
  .btn.join:hover { background: #24334a; border-color: #6fd3ff; }

  #de b { color: #ffd166; }
  #bh b { color: #ff8a65; }

  .joinbox { margin-top: 24px; padding: 16px 18px; border-radius: 12px;
    background: #121a24; border: 1px solid #223040; }
  .joinbox .t { font-size: 12.5px; color: #8fa3b8; margin-bottom: 10px; }
  .row { display: flex; gap: 9px; }
  #room {
    flex: 1; padding: 11px 13px; border-radius: 8px; border: 1px solid #33475c;
    background: #0d151d; color: #e8eef6; font: 15px/1 Consolas, monospace;
    letter-spacing: 1px; outline: none;
  }
  #room:focus { border-color: #6fd3ff; }
  #goj { padding: 11px 20px; border-radius: 8px; border: 0; cursor: pointer;
    background: linear-gradient(180deg,#2f7dd1,#215f9f); color: #fff; font: 600 14px/1 inherit; }
  #goj:active { transform: translateY(1px); }
  #hint { margin-top: 9px; font-size: 12px; color: #e2a08b; min-height: 17px; }
  .note { margin-top: 18px; font-size: 12px; color: #6b8299; line-height: 1.85; }
  .note b { color: #ffb4a2; }

  @media (max-width: 520px) {
    .game { flex-direction: column; align-items: stretch; }
    .game .acts { flex-direction: row; }
    .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>联机大厅</h1>
  <div class="sub">选择游戏开房，或填入好友给你的房号加入。房号前缀就是游戏：<b style="color:#ffd166">de</b> 双刃，<b style="color:#ff8a65">bh</b> Boxhead。</div>

  <div class="game" id="de">
    <div class="meta">
      <div class="name">绝地双刃<span class="tag">双人 / 三人</span></div>
      <div class="desc">两人各自跑一份游戏，只传按键。房主操作菜单。</div>
    </div>
    <div class="acts">
      <a class="btn host" href="net3/host3.html?p=1" id="host-de">开房</a>
      <a class="btn join" href="double-edged.html">说明</a>
    </div>
  </div>

  <div class="game" id="bh">
    <div class="meta">
      <div class="name">盒子头3 · 双人房<span class="tag">汉化版</span></div>
      <div class="desc">Ruffle 直接跑原版 SWF（晓之车汉化）。房主 P1：WASD 移动 · J 射击 · K 换枪；好友 P2：方向键移动 · 小键盘 1 射击 · 小键盘 2 换枪。</div>
    </div>
    <div class="acts">
      <a class="btn host" href="boxhead/host.html">开房</a>
      <a class="btn join" href="boxhead/join.html">好友加入</a>
    </div>
  </div>

  <div class="joinbox">
    <div class="t">已有房号？直接进</div>
    <div class="row">
      <input id="room" placeholder="de… 或 bh…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="goj">加入</button>
    </div>
    <div id="hint"></div>
  </div>

  <div class="note">
    两边都要能访问 <b>0.peerjs.com</b>（信令），视频走 P2P。<br>
    打洞失败时连不上，同一局域网或走 Tailscale 最稳。
  </div>
</div>

<script>
(function () {
  var inp = document.getElementById('room');
  var hint = document.getElementById('hint');

  /* 手机分流：整合时这块被丢了，手机被丢到桌面页 → 黑屏。
     旧大厅（double-edged.html）一直是这么分的：手机开房走 host-phone，
     手机加入直接进 phone.html，不经过 join3。 */
  var isPhone = navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) < 820;

  var hostDe = document.getElementById('host-de');
  if (isPhone && hostDe) { hostDe.href = 'net3/host-phone.html?p=1'; }

  function go() {
    var c = (inp.value || '').trim().toLowerCase().replace(/\s+/g, '');
    if (!c) { inp.focus(); return; }
    if (/^bh/.test(c)) { location.href = 'boxhead/join.html?room=' + encodeURIComponent(c); return; }
    if (/^de/.test(c)) {
      location.href = isPhone
        ? 'net3/phone.html?room=' + encodeURIComponent(c)
        : 'net3/join3.html?room=' + encodeURIComponent(c);
      return;
    }
    hint.textContent = '房号要以 de 或 bh 开头';
    inp.style.borderColor = '#e2725b';
    inp.focus();
  }

  document.getElementById('goj').addEventListener('click', go);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  inp.addEventListener('input', function () {
    inp.value = inp.value.toLowerCase().replace(/[^a-z0-9\-]/g, '');
    inp.style.borderColor = '';
    hint.textContent = '';
  });
})();
</script>
<script>
/* 自动更新：线上 version.json 一变，旧页面自己跳到新地址。
   守卫用 URL 里的 v 和线上版本比，避免「页面比 version.json 旧」时无限重载。 */
(function () {
  var BUILD = '2026-11-03-11';
  var u = new URL(location.href);
  var got = u.searchParams.get('v');
  if (got === BUILD) return;
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.v) return;
      if (got === j.v) return;
      u.searchParams.set('v', j.v);
      location.replace(u.toString());
    })
    .catch(function () {});
})();
</script>
</body>
</html>
