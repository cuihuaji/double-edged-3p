<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>盒子头 2PLAY · Funnel 好友</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; height: 100dvh; background: #07090d; color: #d7e2ee; overflow: hidden;
    font: 14px/1.6 -apple-system, "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none; }
  #view { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* 画面适配（照搬双刃 phone.html）：4:3 画布在任意窗口比例下完整显示（contain），
     dvh 跟得上 iOS 工具栏收起/展开，pixelated 保持像素风清晰 */
  #cv { max-width: 100vw; max-height: 100vh; max-height: 100dvh; width: auto; height: auto;
    aspect-ratio: 4 / 3; object-fit: contain; image-rendering: pixelated;
    background: #000; display: block; }
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: max(5px, env(safe-area-inset-top)) 9px 5px;
    font-family: Consolas, monospace; font-size: 11.5px; color: #8fa3b8; background: rgba(7,9,13,.8);
    border-bottom: 1px solid #1a2532; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 30; }
  #hud b { color: #6fd3ff; }
  #join { position: fixed; inset: 0; z-index: 60; background: #07090d; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 22px; }
  #join h1 { font-size: 19px; margin: 0; }
  #join input { font-family: Consolas, monospace; font-size: 26px; letter-spacing: 8px; text-align: center;
    width: 220px; padding: 12px; background: #101822; border: 1px solid #2a3a4d; border-radius: 9px;
    color: #6fd3ff; text-transform: lowercase; }
  #join button { padding: 14px 40px; font-size: 16px; font-weight: 600; border: 0; border-radius: 9px;
    background: linear-gradient(180deg,#2f7dd1,#215f9f); color: #fff; }
  #join .tip { color: #7d8fa3; font-size: 12.5px; text-align: center; line-height: 1.9; }
  #rotate { position: fixed; inset: 0; z-index: 55; background: #07090d; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #7d8fa3; }
  @media (orientation: portrait) { #rotate { display: flex; } }
  /* 动作键（右侧两颗大键，同双刃手机端布局；尺寸按视口高度算，safe-area 兜刘海） */
  #acts { position: fixed; right: max(12px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom)); z-index: 10000; display: flex; gap: 14px;
    align-items: flex-end; }
  .act { width: min(17vh, 9rem); height: min(17vh, 9rem); border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; color: #e8f3ff; touch-action: none; user-select: none;
    background: radial-gradient(circle at 38% 30%, rgba(70,96,124,.6), rgba(30,42,56,.55) 65%);
    border: 1px solid rgba(120,190,255,.3); box-shadow: 0 6px 16px rgba(0,0,0,.4); }
  .act small { font-size: 11px; font-weight: 500; color: #9db8d4; margin-top: 2px; }
  .act.hit { background: radial-gradient(circle at 38% 30%, rgba(120,200,255,.75), rgba(50,110,170,.7) 65%);
    border-color: rgba(170,220,255,.75); }
  #aFire { background: radial-gradient(circle at 38% 30%, rgba(190,70,70,.6), rgba(110,32,32,.55) 65%);
    border-color: rgba(255,140,140,.35); }
  #aFire.hit { background: radial-gradient(circle at 38% 30%, rgba(255,120,110,.8), rgba(160,50,45,.75) 65%);
    border-color: rgba(255,170,160,.8); }
</style>
</head>
<body>
<div id="view"><canvas id="cv" width="320" height="240"></canvas></div>
<div id="hud">等待画面…</div>

<div id="rotate">📱 请横屏<br><small>摇杆和动作键在左右两侧，竖屏玩不了</small></div>

<div id="acts">
  <div class="act" id="aSwap">换枪<small>Weapon</small></div>
  <div class="act" id="aFire">开火<small>Fire</small></div>
</div>

<div id="join">
  <h1>盒子头 2PLAY · Funnel 好友</h1>
  <input id="room" placeholder="房间码" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="go">加入</button>
  <div class="tip">填房主页上的 4 位房间码（bh 开头）<br>走房主自己的中继，不用装任何东西</div>
</div>

<script src="stick.js"></script>
<script>
(function () {
  'use strict';
  var RELAY = /[?&]relay=([^&]+)/.exec(location.search);
  RELAY = RELAY ? decodeURIComponent(RELAY[1]) : null;
  if (!RELAY) {
    var LOCAL = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
    /* 本机调试直连本地；其它情况（GitHub Pages 等）一律走 Funnel 固定域名 */
    RELAY = LOCAL ? 'ws://' + location.host + '/ws'
                  : 'wss://desktop-a9unfi5.tailb30fe3.ts.net/ws';
  }

  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d');
  var hudEl = $('hud');
  var ws = null, room = '';
  var recv = 0, bytes = 0, lastT = 0, fps = 0, lastSize = 0, firstFrame = true, rtt = 0;

  function hud(mainMsg) {
    if (mainMsg) hudEl.dataset.main = mainMsg;
    hudEl.innerHTML = (hudEl.dataset.main || '等待画面…') +
      ' ｜ <b>' + recv + '</b> 帧 ' + fps.toFixed(1) + ' fps ｜ ' +
      (rtt ? '延迟 <b>' + rtt + 'ms</b> ｜ ' : '') +
      Math.round(lastSize / 1024 * 10) / 10 + ' KB/帧 ｜ ' + Math.round(bytes / 1024) + ' KB';
  }

  function onFrame(buf) {
    var blob = new Blob([buf], { type: 'image/webp' });
    lastSize = buf.byteLength; bytes += buf.byteLength;
    createImageBitmap(blob).then(function (bmp) {
      if (cv.width !== bmp.width || cv.height !== bmp.height) { cv.width = bmp.width; cv.height = bmp.height; }
      ctx.drawImage(bmp, 0, 0);
      bmp.close && bmp.close();
      recv++;
      var now = performance.now();
      if (lastT) { var inst = 1000 / Math.max(1, now - lastT); fps = fps ? fps * 0.8 + inst * 0.2 : inst; }
      lastT = now;
      if (firstFrame) { firstFrame = false; hud('画面已接通 ✓'); }
      hud();
    }).catch(function () {});
  }

  function sendKey(code, down) {
    if (ws && ws.readyState === 1) try { ws.send(JSON.stringify({ data: { t: 'k', c: code, d: down ? 1 : 0 } })); } catch (e) {}
  }

  /* 键盘映射（电脑上打开好友页也能玩）：方向键+小键盘1/2，数字1/2同义 */
  var KEYMAP = {
    ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1,
    Numpad1: 1, Numpad2: 1, Digit1: 1, Digit2: 1,
  };
  addEventListener('keydown', function (e) {
    if (!KEYMAP[e.code] || e.repeat) return;
    e.preventDefault();
    sendKey(e.code === 'Digit1' ? 'Numpad1' : e.code === 'Digit2' ? 'Numpad2' : e.code, true);
  }, { passive: false });
  addEventListener('keyup', function (e) {
    if (!KEYMAP[e.code]) return;
    e.preventDefault();
    sendKey(e.code === 'Digit1' ? 'Numpad1' : e.code === 'Digit2' ? 'Numpad2' : e.code, false);
  }, { passive: false });

  /* 虚拟摇杆（双刃手机端同款 stick.js）：派发标准 Arrow* KeyboardEvent → sendKey 接走 */
  var arrowCodes = { ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39 };
  addEventListener('keydown', function (e) {
    if (arrowCodes[e.code] && !e.repeat) sendKey(e.code, true);
  });
  addEventListener('keyup', function (e) {
    if (arrowCodes[e.code]) sendKey(e.code, false);
  });
  try {
    window.DEStick.mount({ deadzone: 0.2 });
  } catch (e) {}

  /* 动作键：开火 Numpad1 / 换枪 Numpad2 */
  function bindAct(id, code) {
    var el = $(id), active = false;
    function on(e) {
      e.preventDefault();
      if (active) return; active = true; el.classList.add('hit');
      sendKey(code, true);
      if (navigator.vibrate) try { navigator.vibrate(18); } catch (x) {}
    }
    function off(e) {
      e.preventDefault();
      if (!active) return; active = false; el.classList.remove('hit');
      sendKey(code, false);
    }
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  }
  bindAct('aFire', 'Numpad1');
  bindAct('aSwap', 'Numpad2');

  /* 电脑（有鼠标）不放触控按钮：纯键盘玩，不挡视野 */
  var IS_TOUCH = matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches;
  if (!IS_TOUCH) {
    var acts = document.getElementById('acts');
    if (acts) acts.style.display = 'none';
    try { window.DEStick.setEnabled(false, false); } catch (e) {}
    var st = document.getElementById('de-stick');
    if (st) st.style.display = 'none';
    var rot = document.getElementById('rotate');
    if (rot) rot.style.display = 'none';
  }

  function connect(code) {
    room = code;
    ws = new WebSocket(RELAY);
    ws.binaryType = 'arraybuffer';
    hud('连接中继…');
    ws.onopen = function () {
      ws.send(JSON.stringify({ room: room, join: 1 }));
      hud('已连上，等房主推画面…');
      /* 每 3 秒 ping 一次测延迟 */
      setInterval(function () {
        if (ws && ws.readyState === 1) try { ws.send(JSON.stringify({ data: { t: 'ping', ts: Date.now() } })); } catch (e) {}
      }, 3000);
    };
    ws.onmessage = function (ev) {
      if (ev.data instanceof ArrayBuffer) { onFrame(ev.data); return; }
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.sys === 'join') hud('已进入房间');
      var d = m.data;
      if (d && d.t === 'pong' && d.ts) { rtt = Date.now() - d.ts; }
    };
    ws.onclose = function () { hud('中继断开，3 秒后重连…'); setTimeout(function () { connect(room); }, 3000); };
  }

  $('go').addEventListener('click', function () {
    var v = ($('room').value || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    if (v.length < 3) { hud('房间码太短'); return; }
    $('join').style.display = 'none';
    connect(v);
  });
  var q = /[?&]room=([a-z0-9]+)/i.exec(location.search);
  if (q) { $('room').value = q[1].toLowerCase(); $('join').style.display = 'none'; connect(q[1].toLowerCase()); }
  setInterval(function () { hud(); }, 1000);
})();
</script>
</body>
</html>
