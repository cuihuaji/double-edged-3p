<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>盒子头3 · 双人房（汉化版）· 开房</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0f13; color: #e8eef6; overflow: hidden;
    font: 13px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }

  #bar { position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 20;
    display: flex; align-items: center; gap: 12px; padding: 0 14px;
    background: rgba(10,14,19,.92); border-bottom: 1px solid #1e2b38; }
  #bar .k { color: #7b8fa3; font-size: 12px; }
  #room { font-family: Consolas, monospace; font-size: 16px; font-weight: 700;
    letter-spacing: 1px; color: #ffd166; }
  #st { padding: 3px 10px; border-radius: 9px; background: #223040; font-size: 11.5px; color: #8fa3b8; }
  #st.on { background: #1f7a4c; color: #d7ffe8; }
  #st.warn { background: #7a5a1f; color: #ffe9c2; }
  #st.err { background: #7a2a2a; color: #ffd7d7; }
  #bar .sp { margin-left: auto; }
  #bar button, #bar a { padding: 5px 12px; border-radius: 7px; border: 1px solid #33475c;
    background: #16202b; color: #cfe0f0; font-size: 12px; text-decoration: none; cursor: pointer; }
  #bar button:hover, #bar a:hover { background: #1d2a38; border-color: #3f5b78; }

  body { display: grid; place-items: center; padding: 60px 0 40px; }
  #wrap { position: relative; transform-origin: center center; }
  #rc { width: 960px; height: 720px; background: #000; position: relative; overflow: hidden; }
  #rc ruffle-player { width: 640px !important; height: 480px !important;
    transform: scale(1.5); transform-origin: 0 0; }

  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: #6b8299; }

  #gate { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 45%, #1a222c, #070a0d 70%); cursor: pointer; }
  #gate.gone { display: none; }
  #gate .t { text-align: center; }
  #gate .t b { display: block; font-size: 20px; color: #ffd166; margin-bottom: 8px; letter-spacing: 1px; }
  #gate .t span { font-size: 12.5px; color: #7b8fa3; }
</style>
</head>
<body>

<div id="bar">
  <span class="k">房号</span><span id="room">----</span>
  <span id="st">初始化…</span>
  <span class="sp"></span>
  <button id="copy">复制房号</button>
  <button id="resetsave" title="清掉游戏存档，让按键默认值重新生效">重置存档</button>
  <a href="../index.html">返回大厅</a>
</div>

<div id="wrap"><div id="rc"></div></div>
<div id="hint">房主：WASD 移动 · J 射击 · K 换枪　｜　好友：方向键移动 · 小键盘 1 射击 · 小键盘 2 换枪</div>

<div id="gate"><div class="t"><b>点击开始</b><span>浏览器需要一次点击才允许运行与捕捉画面</span></div></div>

<script src="peerjs.min.js"></script>
<script src="../html5/js/ruffle-nightly/ruffle.js"></script>
<script>
/* ===================================================================
   BOXHEAD 2PLAY · 远程同乐 · 房主
   原版 SWF 跑在 Ruffle 里，画面 captureStream 推到好友，
   好友的按键经 DataChannel 回来，用 dispatchEvent 注入 Ruffle。
   信令走 PeerJS 公网云，所以整站是纯静态的。
   =================================================================== */

/* 晓之车汉化版：菜单/武器名/HUD 都是中文。原版是英文矢量图，改不了文字，只能换包体。 */
const SWF = 'boxhead2play_cn.swf';
/* 全局音量：音效资源是原版的，只在这里统一压低，改这个数就行 */
const MASTER_VOLUME = 0.7;

const PEER_OPTS = {
  debug: 0,
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' },
    ],
  },
};

/* 键位已经在 SWF 里改过了（CSaveData 默认值）：
     P1 = WASD 移动 / J 射击 / K 换枪
     P2 = 方向键移动 / 1 射击 / 2 换枪
   所以这一层不用再翻译，只负责把好友的按键原样注入。 */
const KEYCODE = {
  ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39,
  Digit1: 49, Digit2: 50, Digit3: 51,
  Numpad1: 97, Numpad2: 98, Numpad3: 99,
};

const $ = (id) => document.getElementById(id);
const stEl = $('st'), roomEl = $('room'), gateEl = $('gate');

let player = null;
let canvas = null;
let stream = null;
let peer = null;
let conn = null;
let call = null;
let roomId = '';
let idRetry = 0;
let qualityTimer = null;

function setState(text, cls) {
  stEl.textContent = text;
  stEl.className = cls || '';
}

/* ---------- 房号 ---------- */
function randChars(n) {
  const A = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let t = '';
  for (let i = 0; i < n; i++) t += A[(Math.random() * A.length) | 0];
  return t;
}
/* 房号写进地址栏：刷新后还是同一个房间，好友手里的房号不会因为房主刷新就失效 */
const urlRoom = (new URLSearchParams(location.search).get('room') || '').trim().toLowerCase();
roomId = /^bh[a-z0-9]{6}$/.test(urlRoom) ? urlRoom : 'bh' + randChars(6);
roomEl.textContent = roomId;
try {
  const u = new URL(location.href);
  if (u.searchParams.get('room') !== roomId) {
    u.searchParams.set('room', roomId);
    history.replaceState(null, '', u.toString());
  }
} catch (e) {}

/* ---------- 注入按键 ----------
   照抄 net3/vendor/ruffle-touch.js 里能跑通的写法：先聚焦 player，
   然后派发到 **window**（不是 player 元素，派到元素上 Ruffle 收不到），
   并且 key/code/keyCode 三个字段都要给，数字键的 key 要是字符本身。 */
const KEYDEF = {
  ArrowUp:    { key: 'ArrowUp',    code: 'ArrowUp',    keyCode: 38 },
  ArrowDown:  { key: 'ArrowDown',  code: 'ArrowDown',  keyCode: 40 },
  ArrowLeft:  { key: 'ArrowLeft',  code: 'ArrowLeft',  keyCode: 37 },
  ArrowRight: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },
  Numpad1:    { key: '1', code: 'Numpad1', keyCode: 97 },
  Numpad2:    { key: '2', code: 'Numpad2', keyCode: 98 },
  Numpad3:    { key: '3', code: 'Numpad3', keyCode: 99 },
};

function inject(type, code) {
  if (!player) return;
  const d = KEYDEF[code];
  if (!d) return;

  window.__lastInject = { type, code, kc: d.keyCode, at: Date.now() };

  if (document.activeElement !== player) player.focus({ preventScroll: true });

  window.dispatchEvent(new KeyboardEvent(type, {
    key: d.key, code: d.code, keyCode: d.keyCode, which: d.keyCode,
    bubbles: true, cancelable: true, composed: true,
  }));
}
/* 暴露出来便于在控制台/自动化里验证好友按键链路 */
window.__inject = inject;
window.__lastInject = null;

/* ---------- 远端输入：Service Worker 通道 ----------
   Ruffle 的 AVM1 不接合成键盘事件（三种派发目标 + composed 都试过），
   ExternalInterface.available 也是 false。唯一能进 SWF 的是 URL 加载：
   本页把按键状态 postMessage 给 sw.js，SW 在本地拦截 dsh_in.txt 直接应答，
   游戏那边用 loadVariables 轮询。 */
const REMOTE_NAMES = {
  ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', ArrowUp: 'UP', ArrowDown: 'DOWN',
  Numpad1: 'FIRE', Numpad2: 'NEXT_WEAPON', Numpad3: 'PREV_WEAPON',
};
const remoteState = { LEFT: 0, RIGHT: 0, UP: 0, DOWN: 0, FIRE: 0, NEXT_WEAPON: 0, PREV_WEAPON: 0 };
let swWorker = null;

async function initRemoteChannel() {
  if (!('serviceWorker' in navigator)) { window.__swError = 'no serviceWorker'; return; }
  try {
    const reg = await navigator.serviceWorker.register('sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    swWorker = reg.active || reg.waiting || navigator.serviceWorker.controller;
    if (!swWorker && navigator.serviceWorker.controller) swWorker = navigator.serviceWorker.controller;
    window.__swReady = !!swWorker;
    if (!swWorker) setState('远端输入未就绪 · 刷新一次', 'warn');
  } catch (e) { window.__swError = String(e && e.message || e); }
}

function pushRemote() {
  if (!swWorker) swWorker = navigator.serviceWorker.controller;
  if (!swWorker) return;
  try { swWorker.postMessage({ type: 'dsh-keys', keys: remoteState }); } catch (e) {}
}

function setRemote(code, down) {
  const n = REMOTE_NAMES[code];
  if (!n) return false;
  remoteState[n] = down ? 1 : 0;
  pushRemote();
  return true;
}
window.__remoteState = remoteState;
window.__setRemote = setRemote;

/* ---------- 画面质量 ----------
   WebRTC 带宽估紧时会自己降分辨率，好友看到的是一张缩小再放大的糊图。
   必须钉死 scaleResolutionDownBy=1。而且 setParameters 在协商完成前调用
   会被静默丢弃（encodings 还空着），所以协商后要反复重申。 */
function applyQuality() {
  if (!call) return;
  try {
    const pc = call.peerConnection;
    if (!pc) return;
    const sender = pc.getSenders().find((s) => s.track && s.track.kind === 'video');
    if (!sender) return;
    const params = sender.getParameters();
    if (!params.encodings || !params.encodings.length) params.encodings = [{}];
    params.encodings[0].maxBitrate = 8_000_000;
    params.encodings[0].maxFramerate = 30;
    params.encodings[0].scaleResolutionDownBy = 1;
    params.degradationPreference = 'maintain-resolution';
    sender.setParameters(params).catch(() => {});
  } catch (e) { /* 协商未完成时静默跳过 */ }
}

/* ---------- PeerJS ---------- */
function startPeer() {
  setState('连接信令…', 'warn');
  peer = new Peer(roomId, PEER_OPTS);

  peer.on('open', () => {
    setState('等好友加入', 'warn');
    console.log('[host] peer open', roomId);
  });

  peer.on('connection', (c) => {
    conn = c;
    bindData(c);
  });

  peer.on('error', (e) => {
    const t = (e && e.type) || String(e);
    console.warn('[host] peer error', e);
    if (t === 'unavailable-id') {
      /* 这个号被别人占着——最常见的是自己还开着另一个房主页标签，
         或者刚刷新、旧连接在信令上还没释放。
         绝不换号：换号就等于把已经发给好友的房号作废。 */
      if (idRetry < 8) {
        idRetry++;
        setState('房号被占用 · 关掉其它房主页标签 · 重试 ' + idRetry + '/8', 'warn');
        setTimeout(() => {
          try { peer.destroy(); } catch (err) {}
          startPeer();
        }, 1500 * idRetry);
      } else {
        setState('房号被占用 · 关掉其它房主页标签后刷新本页', 'err');
      }
    } else {
      setState('信令错误：' + t, 'err');
    }
  });

  peer.on('disconnected', () => {
    if (!peer || peer.destroyed) return;   /* 主动 destroy 时别再拉回来占着房号 */
    setState('信令断开，重连中…', 'warn');
    try { peer.reconnect(); } catch (e) {}
  });

  /* 页面要被关掉/刷新时立刻释放房号，避免下次注册撞上自己 */
  window.addEventListener('beforeunload', () => {
    try { if (peer && !peer.destroyed) peer.destroy(); } catch (e) {}
  });
}

function bindData(c) {
  /* 好友按键到达时右下角闪一下，用来判断「是没收到」还是「收到了但游戏没反应」 */
  let keyBadge = null;
  function flashKey(code, down) {
    if (!keyBadge) {
      keyBadge = document.createElement('div');
      Object.assign(keyBadge.style, {
        position: 'fixed', right: '12px', bottom: '48px', zIndex: '9',
        pointerEvents: 'none', padding: '4px 9px', borderRadius: '6px',
        background: '#151d27', border: '1px solid #2f3d4f', color: '#8fd0ff',
        font: '12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace',
        transition: 'opacity .25s',
      });
      document.body.appendChild(keyBadge);
    }
    keyBadge.textContent = (down ? '好友按下 ' : '好友松开 ') + code;
    keyBadge.style.opacity = '1';
    clearTimeout(keyBadge._t);
    keyBadge._t = setTimeout(() => { keyBadge.style.opacity = '0.3'; }, 1200);
  }

  c.on('open', () => {
    setState('好友已连接', 'on');
    startVideo(c.peer);
  });

  c.on('data', (d) => {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'k') {
      flashKey(d.code, d.down);
      /* 走 SW 通道进 SWF；只有映射不到的键才退回合成键盘事件 */
      if (!setRemote(d.code, d.down)) inject(d.down ? 'keydown' : 'keyup', d.code);
    } else if (d.t === 'ping') {
      try { c.send({ t: 'pong', at: d.at }); } catch (e) {}
    }
  });

  c.on('close', () => {
    setState('好友断开 · 等重连', 'warn');
    /* 断线时把残留的按下状态清掉，否则角色会一直朝一个方向跑 */
    for (const k of Object.keys(remoteState)) remoteState[k] = 0;
    pushRemote();
    if (qualityTimer) { clearInterval(qualityTimer); qualityTimer = null; }
  });

  c.on('error', (e) => console.warn('[host] data error', e));
}

function startVideo(remoteId) {
  if (!canvas) { setState('画布未就绪', 'err'); return; }
  try {
    stream = canvas.captureStream(30);
  } catch (e) {
    setState('浏览器不支持 captureStream', 'err');
    return;
  }
  for (const t of stream.getVideoTracks()) {
    try { t.contentHint = 'detail'; } catch (e) {}
  }

  call = peer.call(remoteId, stream);

  [600, 1500, 3000, 6000, 12000].forEach((ms) => setTimeout(applyQuality, ms));
  if (qualityTimer) clearInterval(qualityTimer);
  qualityTimer = setInterval(applyQuality, 4000);
}

/* ---------- 布局自适应 ---------- */
function fitStage() {
  const wrap = $('wrap');
  /* 顶栏 44 + 底部提示条，留够让位，别让提示压到画面上 */
  const s = Math.min(1, (innerWidth - 32) / 960, (innerHeight - 124) / 720);
  wrap.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fitStage);
fitStage();

/* ---------- 启动 ---------- */
async function boot() {
  gateEl.classList.add('gone');
  setState('加载原版…', 'warn');
  initRemoteChannel();

  try {
    /* Ruffle 的缩放模式是全局配置，必须在 createPlayer 之前设。
       volume 用运行时全局音量压整体响度，音效资源保持原版不动。 */
    window.RufflePlayer.config = Object.assign({}, window.RufflePlayer.config, {
      letterbox: 'off',
      quality: 'high',
      volume: MASTER_VOLUME,
    });

    const ruffle = window.RufflePlayer.newest();
    const p = ruffle.createPlayer();
    p.style.width = '640px';
    p.style.height = '480px';
    p.style.transform = 'scale(1.5)';
    p.style.transformOrigin = '0 0';
    $('rc').appendChild(p);

    /* Pages 重建窗口里 SWF 会短暂 404，直接 load 会掉进 Ruffle 的报错页。
       先自己探测，最多重试 3 次（每次换 cache-busting 参数）。 */
    setState('加载游戏…', 'warn');
    let ok = false;
    let lastLoadErr = '';
    for (let i = 0; i < 3 && !ok; i++) {
      if (i) { setState(`游戏文件还没同步好，重试 ${i}/3 …`, 'warn'); await new Promise(r => setTimeout(r, 1200)); }
      try {
        const res = await fetch(`${SWF}?v=${Date.now()}`, { method: 'HEAD', cache: 'no-store' });
        ok = res.ok;
        if (!ok) lastLoadErr = 'HTTP ' + res.status;
      } catch (e) { lastLoadErr = (e && e.message) || String(e); }
    }
    if (!ok) { setState('游戏文件取不到（' + lastLoadErr + '），稍等几秒再刷新本页', 'err'); return; }

    await p.load(SWF + '?v=' + Date.now());
    player = p;
    window.__traces = window.__traces || [];
    try { p.traceObserver = (m) => { window.__traces.push(String(m)); if (window.__traces.length > 200) window.__traces.shift(); }; } catch (e) {}
    p.tabIndex = 0;
    p.focus();

    canvas = p.shadowRoot && p.shadowRoot.querySelector('canvas');
    if (!canvas) { setState('找不到画布', 'err'); return; }

    try { await p.play(); } catch (e) {}
    /* 兜底：config.volume 在这个 nightly 上不生效，用 volume 属性赋值
       （原型上有 setter，实测 1 -> 0.55 生效）。 */
    try { p.volume = MASTER_VOLUME; } catch (e) {}
    fitStage();
    setState('准备就绪', 'warn');

    startPeer();
  } catch (e) {
    console.error(e);
    setState('加载失败：' + (e && e.message), 'err');
  }
}

gateEl.addEventListener('click', boot, { once: true });

/* 点画面 / 按任意键都保持 Ruffle 焦点。
   原来只 focus 不补发，导致「焦点不在画面时按下的第一下按键被吞掉」，
   体感就是必须先在画面里点一下才按得动。这里改成：焦点不对时先把这一下
   原样转发给 Ruffle（带真实 code/key/keyCode，不受 KEYCODE 映射表限制）。 */
function forwardKey(e) {
  if (!player) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.activeElement === player) return;
  player.focus({ preventScroll: true });
  window.dispatchEvent(new KeyboardEvent(e.type, {
    code: e.code, key: e.key, keyCode: e.keyCode, which: e.keyCode,
    bubbles: true, cancelable: true, composed: true,
  }));
  e.preventDefault();
}
addEventListener('keydown', forwardKey, true);
addEventListener('keyup', forwardKey, true);
addEventListener('pointerdown', () => { if (player) player.focus({ preventScroll: true }); }, true);

/* 重置存档：按键默认值只在「没有存档」时写入，旧存档会盖住新的键位。
   Ruffle 把 SharedObject 存在 IndexedDB 里，删掉再刷新即可。 */
$('resetsave').addEventListener('click', async () => {
  const btn = $('resetsave');
  btn.disabled = true;
  btn.textContent = '清理中…';
  try {
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      for (const d of dbs) {
        /* Ruffle 的库名由 wasm 侧决定，猜不准，本域下只有这两个游戏，直接全删 */
        if (!d.name) continue;
        await new Promise((res) => {
          const req = indexedDB.deleteDatabase(d.name);
          req.onsuccess = req.onerror = req.onblocked = () => res();
        });
      }
    }
  } catch (e) {}
  try {
    for (const k of Object.keys(localStorage)) {
      if (/ruffle|shared|flash/i.test(k)) localStorage.removeItem(k);
    }
  } catch (e) {}
  location.reload();
});

/* 复制房号 */
$('copy').addEventListener('click', async () => {
  const url = location.origin + location.pathname.replace(/host\.html$/, 'join.html') + '?room=' + roomId;
  try {
    await navigator.clipboard.writeText(roomId);
    $('copy').textContent = '已复制';
  } catch (e) {
    $('copy').textContent = '手动复制';
  }
  setTimeout(() => { $('copy').textContent = '复制房号'; }, 1500);
});

addEventListener('beforeunload', () => {
  try { if (peer) peer.destroy(); } catch (e) {}
});

/* ---------- 连接诊断条（右下角，一秒刷新一次）---------- */
(function () {
  const el = document.createElement('div');
  el.id = 'diag';
  Object.assign(el.style, {
    position: 'fixed', left: '10px', bottom: '10px', zIndex: '9',
    pointerEvents: 'none', padding: '3px 8px', borderRadius: '5px',
    background: 'rgba(13,20,28,.86)', border: '1px solid #26323f',
    color: '#6f8ba3', font: '11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace',
    whiteSpace: 'pre',
  });
  document.body.appendChild(el);
  setInterval(() => {
    const p = (typeof peer !== 'undefined') ? peer : null;
    const c = (typeof conn !== 'undefined') ? conn : null;
    const pc = c && c.peerConnection;
    const room = (document.getElementById('room') || {}).textContent || '-';
    el.textContent =
      '房号 ' + room +
      '  信令 ' + (p && p.open ? 'on' : 'off') +
      '  好友 ' + (c && c.open ? 'on' : 'off') +
      '  ICE ' + (pc ? pc.iceConnectionState : '-');
  }, 1000);
})();
</script>
</body>
</html>
