<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>盒子头3 · 双人房（汉化版）· 加入</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0d0f13; color: #e8eef6; overflow: hidden;
    font: 13px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }

  /* 好友端画面不再是铺满整屏，跟房主那边一样是 960x720 的窗口，
     窗口更小的时候按 4:3 等比缩，不拉伸也不裁切。 */
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  #stage.hide { display: none; }
  #frame {
    width: min(960px, 100vw, calc(100vh * 4 / 3));
    aspect-ratio: 4 / 3;
    background: #000;
    box-shadow: 0 0 0 1px #1e2b38;
  }
  #rv { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }

  #bar { position: fixed; top: 0; left: 0; right: 0; height: 38px; z-index: 20;
    display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 12px;
    background: rgba(10,14,19,.82); border-bottom: 1px solid #1e2b38; transition: opacity .25s; }
  #bar.idle { opacity: 0; pointer-events: none; }
  #st { padding: 3px 9px; border-radius: 9px; background: #223040; font-size: 11px; color: #8fa3b8; }
  #st.on { background: #1f7a4c; color: #d7ffe8; }
  #st.warn { background: #7a5a1f; color: #ffe9c2; }
  #st.err { background: #7a2a2a; color: #ffd7d7; }
  #lat { color: #7b8fa3; font-family: Consolas, monospace; }
  #bar .sp { margin-left: auto; }
  #bar button { padding: 4px 11px; border-radius: 6px; border: 1px solid #33475c;
    background: #16202b; color: #cfe0f0; font-size: 12px; cursor: pointer; }
  #bar button:hover { background: #1d2a38; }

  #join { position: fixed; inset: 0; display: grid; place-items: center; z-index: 40;
    background: radial-gradient(circle at 50% 40%, #1a222c, #070a0d 70%); }
  #join.gone { display: none; }
  #join .box { width: 300px; text-align: center; }
  #join h1 { margin: 0 0 4px; font-size: 18px; color: #ffd166; letter-spacing: 1px; }
  #join .sub { margin: 0 0 20px; font-size: 12px; color: #7b8fa3; }
  #code { width: 100%; padding: 12px 0; text-align: center; font: 700 22px/1 Consolas, monospace;
    letter-spacing: 4px; border-radius: 9px; border: 1px solid #33475c;
    background: #121a24; color: #ffd166; outline: none; text-transform: lowercase; }
  #code:focus { border-color: #6fd3ff; }
  #go { margin-top: 12px; width: 100%; padding: 12px; border-radius: 9px; border: 0;
    background: linear-gradient(180deg,#2f7dd1,#215f9f); color: #fff; font: 700 14px/1 inherit; cursor: pointer; }
  #go:disabled { background: #2a3440; color: #6b8299; cursor: default; }
  #msg { margin-top: 12px; min-height: 18px; font-size: 12px; color: #e2a08b; }
  #back { display: inline-block; margin-top: 16px; font-size: 12px; color: #6b8299; text-decoration: none; }
  #back:hover { color: #ffd166; }

  #tap { position: fixed; inset: 0; z-index: 30; display: none; place-items: center;
    background: rgba(6,9,12,.75); cursor: pointer; }
  #tap.on { display: grid; }
  #tap div { text-align: center; color: #ffd166; font-size: 15px; }
</style>
</head>
<body>

<div id="stage" class="hide"><div id="frame"><video id="rv" autoplay playsinline muted></video></div></div>

<div id="bar" class="idle">
  <span id="st">未连接</span>
  <span id="lat"></span>
  <span class="sp"></span>
  <button id="fs">全屏</button>
  <button id="quit">退出</button>
</div>

<div id="join">
  <div class="box">
    <h1>盒子头3 · 双人房</h1>
    <p class="sub">输入房主给你的房号 · 方向键移动 · 小键盘 1 射击 · 小键盘 2 换枪</p>
    <input id="code" maxlength="10" placeholder="bhxxxxxx" autocomplete="off" spellcheck="false">
    <button id="go">加入</button>
    <div id="msg"></div>
    <a href="../index.html" id="back">← 返回大厅</a>
  </div>
</div>

<div id="tap"><div>点击画面继续<br><span style="font-size:12px;color:#7b8fa3">浏览器需要一次点击才允许播放</span></div></div>

<script src="peerjs.min.js"></script>
<script>
/* ===================================================================
   BOXHEAD 2PLAY · 远程同乐 · 好友
   收房主的视频流显示；本地按键回传，房主注入到 Ruffle。
   好友控制 P2（原版默认：WASD + 空格 + E/Q），方向键映射到 WASD。
   =================================================================== */

const PEER_OPTS = {
  debug: 0,
  config: {
    /* 只用 STUN 拿公网映射；多列几个是为了提高「至少有一个能返回 srflx」的概率。
       Google 在部分网络不可达，miiwifi/bilibili/hitv 在国内通常可达，
       cloudflare/nextcloud 走 443，穿透性更好。 */
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
      { urls: 'stun:stun.miwifi.com:3478' },
      { urls: 'stun:stun.chat.bilibili.com:3478' },
      { urls: 'stun:stun.hitv.com:3478' },
      { urls: 'stun:global.stun.twilio.com:3478' },
      { urls: 'stun:stun.nextcloud.com:443' },
    ],
    iceCandidatePoolSize: 2,
  },
};

/* SWF 里 P2 已经是：方向键移动 / 小键盘 1 射击 / 小键盘 2 换枪。
   小键盘原样转发；主键盘那排 1/2/3 额外归一到小键盘，方便没有数字区的键盘。 */
const MAP = {
  ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown', ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight',
  Numpad1: 'Numpad1', Numpad2: 'Numpad2', Numpad3: 'Numpad3',
  Digit1: 'Numpad1', Digit2: 'Numpad2', Digit3: 'Numpad3',
};

const $ = (id) => document.getElementById(id);
const rv = $('rv'), stEl = $('st'), msgEl = $('msg'), latEl = $('lat');
const joinEl = $('join'), stageEl = $('stage'), barEl = $('bar'), tapEl = $('tap');
const codeEl = $('code'), goEl = $('go');

let peer = null, conn = null, call = null, room = '';
let connected = false;
let tries = 0;
let openTimer = null;
let iceTimer = null;
const pressed = new Set();

function setState(t, cls) { stEl.textContent = t; stEl.className = cls || ''; }
function msg(t) { msgEl.textContent = t || ''; }

/* ---------- 连接 ---------- */
async function connect(manual) {
  if (manual) tries = 0;
  room = (codeEl.value || '').trim().toLowerCase();
  if (!room) { msg('先填房号'); return; }
  await ensureTurn();

  goEl.disabled = true;
  msg('正在连接…');
  setState('连接信令…', 'warn');

  if (peer) { try { peer.destroy(); } catch (e) {} }

  /* 好友用匿名 id，房主那边按房号找人 */
  peer = new Peer(null, PEER_OPTS);

  peer.on('open', () => {
    msg('已找到房，连接中…');
    conn = peer.connect(room, { reliable: true });

    conn.on('open', () => {
      connected = true;
      tries = 0;
      clearTimeout(openTimer);
      openTimer = null;
      clearInterval(iceTimer);
      iceTimer = null;
      setState('已连接', 'on');
      barEl.classList.remove('idle');
      msg('');
      startPing();
    });

    /* 房号能查到但一直不开：房主刷新过页面，旧 peer id 还挂在信令上，
       或者 ICE 没打通。12 秒不开就换一个新的 Peer 重连。 */
    /* ICE 打不通（对称型 NAT / UDP 被封）时 PeerJS 会永远停在 checking。
       一旦 failed 就换一对新端口重建，比干等有效。 */
    clearInterval(iceTimer);
    iceTimer = setInterval(() => {
      const pc = conn && conn.peerConnection;
      if (!pc || connected) return;
      if (pc.iceConnectionState === 'failed') {
        clearInterval(iceTimer);
        iceTimer = null;
        tries++;
        if (tries <= 12) {
          msg('网络打不通，重建连接 ' + tries + '/12 …');
          setState('重试中', 'warn');
          try { peer.destroy(); } catch (e) {}
          connect();
        } else {
          msg('两边网络打不通：试试换手机热点、关掉代理/VPN 再连');
          setState('网络不通', 'err');
        }
      }
    }, 1500);

    clearTimeout(openTimer);
    openTimer = setTimeout(() => {
      if (connected) return;
      tries++;
      if (tries <= 5) {
        msg('房主没应答，重连 ' + tries + '/5 …');
        setState('重试中', 'warn');
        try { peer.destroy(); } catch (e) {}
        goEl.disabled = false;
        connect();
      } else {
        msg('连不上：房主可能刷新过页面、房号已经变了——让他重新发一次房号');
        setState('房号已失效', 'err');
        goEl.disabled = false;
      }
    }, 12000);

    conn.on('data', (d) => {
      if (d && typeof d === 'object' && d.t === 'pong') onPong(d);
    });

    conn.on('close', () => { connected = false; setState('连接断开', 'warn'); });
    conn.on('error', (e) => console.warn('[guest] data error', e));
  });

  /* 房主把画面 call 过来，这里应答并挂到 video 上 */
  peer.on('call', (c) => {
    call = c;
    c.answer();
    c.on('stream', (s) => {
      rv.srcObject = s;
      stageEl.classList.remove('hide');
      joinEl.classList.add('gone');
      rv.play().catch(() => tapEl.classList.add('on'));
    });
  });

  peer.on('error', (e) => {
    const t = (e && e.type) || String(e);
    console.warn('[guest] peer error', e);
    if (t === 'peer-unavailable') {
      /* 公网信令是多实例的，偶尔查到别的实例上就没有这个房间。
         房主其实在线，直接重试几次基本都能对上。 */
      tries++;
      if (tries <= 12) {
        /* 公网信令是多实例的，偶尔查到别的实例上就没有这个房间。
           房主其实在线，多试十几秒基本都能对上。 */
        msg('房号还没对上，自动重试 ' + tries + '/12 …');
        setState('重试中', 'warn');
        setTimeout(() => { goEl.disabled = false; connect(); }, 3000);
        return;
      }
      msg('找不到这个房间，确认房主还开着页面');
      setState('房间不存在', 'err');
    } else if (t === 'network' || t === 'server-error') {
      msg('连不上信令服务器（0.peerjs.com）');
      setState('信令不可用', 'err');
    } else {
      msg('出错了：' + t);
      setState('错误', 'err');
    }
    goEl.disabled = false;
  });

  peer.on('disconnected', () => {
    setState('信令断开', 'warn');
    try { peer.reconnect(); } catch (e) {}
  });
}

/* ---------- 输入回传 ---------- */
function sendKey(code, down) {
  if (!conn || !conn.open) return;
  const mapped = MAP[code];
  if (!mapped) return;
  if (down) pressed.add(mapped); else pressed.delete(mapped);
  try { conn.send({ t: 'k', code: mapped, down }); } catch (e) {}
}

addEventListener('keydown', (e) => {
  if (!connected) return;
  if (MAP[e.code]) { e.preventDefault(); sendKey(e.code, true); }
}, { passive: false });

addEventListener('keyup', (e) => {
  if (!connected) return;
  if (MAP[e.code]) { e.preventDefault(); sendKey(e.code, false); }
}, { passive: false });

/* 切走时把按下的键松开，避免房主那边卡键 */
addEventListener('blur', () => {
  if (!connected) return;
  for (const c of [...pressed]) sendKey(c, false);
});

/* ---------- 延迟 ---------- */
function startPing() {
  setInterval(() => {
    if (!conn || !conn.open) { latEl.textContent = ''; return; }
    try { conn.send({ t: 'ping', at: performance.now() }); } catch (e) {}
  }, 1500);
}
function onPong(m) {
  if (typeof m.at !== 'number') return;
  const ms = Math.round(performance.now() - m.at);
  latEl.textContent = ms + ' ms';
  latEl.style.color = ms < 60 ? '#7fd48a' : ms < 120 ? '#ffd166' : '#e28a7a';
}

/* ---------- 交互 ---------- */
goEl.onclick = () => connect(true);
codeEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(true); });
codeEl.addEventListener('input', () => {
  codeEl.value = codeEl.value.toLowerCase().replace(/[^a-z0-9\-]/g, '').slice(0, 10);
});
tapEl.onclick = () => { tapEl.classList.remove('on'); rv.play().catch(() => {}); };

$('fs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
};
$('quit').onclick = () => location.reload();

let idleTimer = null;
function bumpIdle() {
  barEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (connected) barEl.classList.add('idle'); }, 3000);
}
addEventListener('mousemove', bumpIdle);
addEventListener('touchstart', bumpIdle, { passive: true });
bumpIdle();

/* 从大厅带房号进来就直接连 */
const q = new URLSearchParams(location.search).get('room');
if (q) {
  codeEl.value = q.toLowerCase().slice(0, 10);
  setTimeout(() => { if (!connected) connect(true); }, 200);
}

addEventListener('beforeunload', () => { try { if (peer) peer.destroy(); } catch (e) {} });


/* ---------- 连接诊断条 v2（左下角，一秒刷新）---------- */
(function () {
  const el = document.createElement('div');
  el.id = 'diag';
  Object.assign(el.style, {
    position: 'fixed', left: '10px', bottom: '10px', zIndex: '9',
    pointerEvents: 'none', padding: '3px 8px', borderRadius: '5px',
    background: 'rgba(13,20,28,.86)', border: '1px solid #26323f',
    color: '#6f8ba3', font: '11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace',
    whiteSpace: 'pre',
  });
  (document.body || document.documentElement).appendChild(el);

  const seen = { L: {}, R: {} };
  let hooked = null;

  function hook(pc) {
    if (!pc || hooked === pc) return;
    hooked = pc;
    seen.L = {}; seen.R = {};
    pc.addEventListener('icecandidate', (e) => {
      if (!e.candidate) return;
      const t = (e.candidate.candidate.match(/ typ (\w+)/) || [])[1] || '?';
      seen.L[t] = (seen.L[t] || 0) + 1;
    });
  }

  const fmt = (o) => ['host', 'srflx', 'prflx', 'relay']
    .filter((k) => o[k]).map((k) => k[0] + o[k]).join('') || '-';

  setInterval(async () => {
    const p = (typeof peer !== 'undefined') ? peer : null;
    const c = (typeof conn !== 'undefined') ? conn : null;
    const pc = c && c.peerConnection;
    hook(pc);
    const remote = {};
    const local = {};
    if (pc) {
      try {
        const st = await pc.getStats();
        st.forEach((r) => {
          if (r.type === 'remote-candidate') {
            const t = r.candidateType || '?';
            remote[t] = (remote[t] || 0) + 1;
          } else if (r.type === 'local-candidate') {
            const t = r.candidateType || '?';
            local[t] = (local[t] || 0) + 1;
          }
        });
      } catch (e) {}
    }
    for (const k in seen.L) local[k] = (local[k] || 0) + 0;
    if (pc && pc.iceConnectionState === 'connected') window.__iceStuck = 0;
    const roomEl = document.getElementById('room') || document.getElementById('code');
    const room = roomEl ? (roomEl.textContent || roomEl.value || '-') : '-';
    el.textContent =
      '房号 ' + room +
      '  建 2026-11-03-5' +
      '  信令 ' + (p && p.open ? 'on' : 'off') +
      '  好友 ' + (c && c.open ? 'on' : 'off') +
      '  ICE ' + (pc ? pc.iceConnectionState : '-') +
      '  本地候选 ' + fmt(local) +
      '  对方候选 ' + fmt(remote) +
      '  自身映射 ' + (window.__selfMap.state === 'probing' ? '…' : (window.__selfMap.mapped ? '√ ' + window.__selfMap.mapped : '无')) +
      (pc && pc.iceConnectionState === 'checking' && (remote.srflx || 0) > 0 && (window.__iceStuck = (window.__iceStuck || 0) + 1) > 12
        ? '  ← 两边都有公网映射却打不通：查代理/加速器/防火墙'
        : '');
  }, 1000);
})();


/* ---------- TURN 配置（turn.json）----------
   填了就在 ICE 里加上中继；没填就纯 STUN，行为和以前一样。
   单独放文件，是为了以后换 TURN 不用改页面代码。 */
let __turnPromise = null;
function ensureTurn() {
  if (__turnPromise) return __turnPromise;
  __turnPromise = fetch('turn.json?t=' + Date.now(), { cache: 'no-store' })
    .then((r) => r.json())
    .then((j) => {
      if (!j || !j.urls) return null;
      const list = Array.isArray(j.urls) ? j.urls : [j.urls];
      if (!list.length || !list[0]) return null;
      const s = { urls: list.length > 1 ? list : list[0], username: j.username || '', credential: j.credential || '' };
      PEER_OPTS.config.iceServers.unshift(s);
      window.__turn = s.urls;
      return s;
    })
    .catch(() => null);
  return __turnPromise;
}

/* ---------- 开机自检：这页自己能不能拿到公网映射（srflx）----------
   不需要任何人连进来。拿不到就说明本机 UDP/STUN 出不去，
   这种情况下对方再健康也连不上。 */
window.__selfMap = { state: 'probing', mapped: null };
(function () {
  let pc;
  try {
    pc = new RTCPeerConnection({ iceServers: PEER_OPTS.config.iceServers });
  } catch (e) { window.__selfMap = { state: 'error', mapped: null, err: String(e) }; return; }
  let done = false;
  const fin = () => {
    if (done) return;
    done = true;
    try { pc.close(); } catch (e) {}
    if (window.__selfMap.state === 'probing') window.__selfMap.state = 'none';
  };
  pc.onicecandidate = (e) => {
    if (!e.candidate) return;
    const c = e.candidate;
    const t = (c.candidate.match(/ typ (\w+)/) || [])[1];
    if (t === 'srflx' && !window.__selfMap.mapped) {
      window.__selfMap = { state: 'ok', mapped: (c.address || '') + ':' + (c.port || '') };
      fin();
    }
  };
  try {
    pc.createDataChannel('selfprobe');
    pc.createOffer().then((o) => pc.setLocalDescription(o)).catch(fin);
  } catch (e) { fin(); }
  setTimeout(fin, 6000);
})();
/* ---------- 自动更新 ----------
   线上 version.json 一变，旧页面自己跳到 ?v= 新地址。
   守卫用「URL 里的 v」和「线上版本」比，不用页面里的 BUILD 比——
   否则页面代码比 version.json 旧时会自己跳自己，无限重载。 */
(function () {
  const BUILD = '2026-11-03-5';
  const u = new URL(location.href);
  const got = u.searchParams.get('v');
  if (got === BUILD) return;
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then((r) => r.json())
    .then((j) => {
      if (!j || !j.v) return;
      if (got === j.v) return;
      u.searchParams.set('v', j.v);
      location.replace(u.toString());
    })
    .catch(() => {});
})();
</script>
</body>
</html>
