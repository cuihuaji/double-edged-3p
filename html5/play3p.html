<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<title>Double Edged · 双人联机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 页面本身固定成 550x400 的 1.6 倍：AVM 按容器尺寸决定画布像素和舞台比例，
     两端只有容器一样大，算出的包围盒才会一样（命中判定依赖包围盒）。 */
  /* 画布必须待在 (0,0)：AVM 计算鼠标坐标时按原点算，居中会让点击整体偏移 */
  /* AVM 算鼠标坐标时按画布左上角 = 页面原点。画布一旦有偏移，点击就整体偏。
     所以 body 零边距、画布绝对定位到 (0,0)。 */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090c; overflow: hidden; }

  #splash__image {
    position: absolute; left: 0; top: 0;
    background-repeat: no-repeat; background-size: cover;
    background-image: url("assets/todo.jpg");
    visibility: visible; z-index: 10;
  }
  #progress__root { position: absolute; }
  #progress__line { width: 0; height: 100%; transition: all .5s; }
  #loading__image {
    position: absolute; background-size: contain;
    background-position: center; background-repeat: no-repeat;
  }
  canvas {
    outline: none;
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
  }
</style>
</head>
<body>
<div id="splash__image">
  <div id="progress__root"><div id="progress__line"></div></div>
  <div id="loading__image"></div>
</div>

<script>
/* ============ 确定性运行时（必须在游戏脚本之前） ============
 * 1) Math.random 换成可播种 PRNG
 * 2) requestAnimationFrame 换成手动队列 —— 一步 = 一帧游戏
 * 3) performance.now / Date 换成虚拟时钟（固定步长 1000/30）
 * 这样游戏只会因为「被调用 step()」而前进，永远不会自己跑。
 */
(function () {
  "use strict";
  var Q = new URLSearchParams(location.search);
  var SEED = parseInt(Q.get("seed") || "20261027", 10) >>> 0;

  /* ---- 渲染分辨率：?dpr=1（借 N 社手机版的思路 —— 低分辨率渲染、再放大显示）----
   * 运行时 WebGL 的 configureBackBuffer 里写的是 width = stageW * devicePixelRatio，
   * 手机 dpr=3 时 550×400 的舞台会变成 1650×1200 的后备缓冲，一帧多画 9 倍像素，
   * 加上我们把容器开成 880×640，实际是原生尺寸的 23 倍填充量 —— 这就是手机开房卡的主因。
   * dpr=1 把后备缓冲钉回逻辑像素，屏幕上的放大交给 CSS 合成（GPU，几乎免费）。 */
  var FORCED_DPR = (function () {
    var v = Q.get("dpr");
    if (v === null || v === "") return 0;
    var n = parseFloat(v);
    return (isFinite(n) && n > 0 && n <= 4) ? n : 0;
  })();
  if (FORCED_DPR) {
    try {
      Object.defineProperty(window, "devicePixelRatio", {
        configurable: true, enumerable: true,
        get: function () { return FORCED_DPR; }
      });
      window.__deDpr = FORCED_DPR;
    } catch (e) {}
  }
  var STEP = 1000 / 30;

  var L = {
    seed: SEED,
    frames: 0,        // 已推进的帧数（进入锁步后从 0 计）
    started: false,   // 游戏真正开始（资源载完、进入主循环）
    phase: "loading", // loading -> ready -> running
    randCalls: 0,
    vnow: 0
  };

  /* ---- 按序号取值的 PRNG ----
     关键：第 i 次调用必然得到同一个数，与"之前调用过几次"无关。
     这样只要两端在每帧开始时的序号相同，整帧内所有随机数就完全相同；
     即使某一端在进关卡前多消耗了几次，也不会永久错位。 */
  var rs = SEED;
  function rndAt(i) {
    var x = (SEED ^ Math.imul((i >>> 0) + 0x9E3779B9, 0x85EBCA6B)) >>> 0;
    x ^= x >>> 16; x = Math.imul(x, 0x7feb352d) >>> 0;
    x ^= x >>> 15; x = Math.imul(x, 0x846ca68b) >>> 0;
    x ^= x >>> 16;
    return (x >>> 0) / 4294967296;
  }
  Math.random = function () { return rndAt(L.randCalls++); };
  L.resetRng = function () { rs = SEED; L.randCalls = 0; };
  L.rndAt = rndAt;

  /* ---- 手动 RAF 队列 ---- */
  var q = [], seq = 0, lastCb = null;
  window.requestAnimationFrame = function (cb) { lastCb = cb; q.push([++seq, cb]); return seq; };
  window.cancelAnimationFrame = function (id) {
    for (var i = 0; i < q.length; i++) if (q[i][0] === id) q[i][1] = null;
  };

  /* ---- 虚拟时钟 ---- */
  performance.now = function () { return L.vnow; };
  var RealDate = Date, BASE = 1700000000000;
  function VDate() {
    if (arguments.length === 0) return new RealDate(BASE + L.vnow);
    if (arguments.length === 1) return new RealDate(arguments[0]);
    return new RealDate(arguments[0], arguments[1], arguments[2] || 1,
                       arguments[3] || 0, arguments[4] || 0, arguments[5] || 0, arguments[6] || 0);
  }
  VDate.now = function () { return BASE + L.vnow; };
  VDate.parse = RealDate.parse;
  VDate.UTC = RealDate.UTC;
  VDate.prototype = RealDate.prototype;
  window.Date = VDate;

  /* ---- 诊断：上报随机数调用次数（判断两端 RNG 流是否错位）---- */
  var SLOT = (new URLSearchParams(location.search).get("slot") || "1");
  setInterval(function () {
    try {
      fetch("/diag/r?slot=" + SLOT + "&n=" + L.randCalls + "&f=" + (L.frames || 0));
    } catch (e) {}
  }, 500);

  /* ---- 单步推进：排空一次队列 = 一帧游戏 ---- */
  var perfLastStep = 0;
  function stepOnce() {
    /* 卡顿定位：记录两次步进之间的真实间隔。33.3ms 是稳态，
     * 出现 80ms+ 说明这一帧真的被拖住了（不管是被谁的代码）。 */
    try {
      var pn = performance.now();
      if (perfLastStep) {
        var gap = pn - perfLastStep;
        var pp = window.__perfStep || (window.__perfStep = { n: 0, max: 0, over60: 0, sum: 0 });
        pp.n++; pp.sum += gap; if (gap > pp.max) pp.max = gap; if (gap > 60) pp.over60++;
        pp.avg = Math.round((pp.sum / pp.n) * 10) / 10; pp.max = Math.round(pp.max * 10) / 10;
        if (pp.n > 900) { pp.n = 0; pp.sum = 0; pp.max = 0; pp.over60 = 0; }
      }
      perfLastStep = pn;
    } catch (e) {}
    L.vnow += STEP;
    var cur = q; q = [];
    var ran = 0;
    for (var i = 0; i < cur.length; i++) {
      if (!cur[i][1]) continue;
      ran++;
      try { cur[i][1](L.vnow); } catch (e) { window.__rafErrs && window.__rafErrs.push((e && e.stack) ? String(e.stack).slice(0, 1500) : String(e)); }
    }
    L.qLen = ran;               // 这一步排空了几个内部回调（正常应为 1）
    if (L.started) L.frames++;
    /* 远程同乐推帧（与 captureStream(0) 配对）：每推进一帧就显式请求一次画面帧。
     * 不能靠 captureStream(30) 的自动出帧——那条路依赖浏览器合成，
     * 标签页不可见/被遮挡时 Chrome 会暂停 canvas 合成捕获，
     * 结果就是好友端画面定格、房主端却还在跑（已实测确认的症状）。
     * 本驱动走 Worker 定时器，不受标签页节流影响，因此显式推帧能持续。 */
    if (L.started) {
      try {
        var __ct = window.__npCapTrack;
        if (__ct && __ct.requestFrame) __ct.requestFrame();
      } catch (e) {}
    }
    /* 自愈：队列空了（某帧回调抛错前没重新注册 RAF）但还在自转 → 用上一帧回调兜底续帧，
     * 否则游戏循环永久死亡 = 战斗中冻屏。只在非锁步（self-drive）模式兜底。 */
    if (ran === 0 && lastCb && L.phase !== "running") {
      q.push([++seq, lastCb]);
    }
    return ran;
  }

  /* ---- 帧驱动三段式 ----
   * loading：30fps 自转（预加载动画）
   * ready（等联机）：30fps 自转继续——等朋友时游戏保持可看可点
   *   （点击在锁步起跑前由 applyLocalEvents 直注游戏，见下）
   * running（锁步接管）：freeT 停转，lock.js 的节拍器独占推帧
   *
   * 节流免疫：自转节拍走 Web Worker（Blob 内联），Worker 的定时器不受
   * 标签页后台节流影响——同机多窗 / 切后台时输入帧照常生成，锁步不卡闸。
   * Worker 不可用（极端环境）时回退主线程 setInterval。 */
  var _wTicker = null, _wFallback = null;
  /* 锁步起跑时由 lock.js 调用：停自转 Worker，帧驱动权交给锁步节拍器
   * （缺了这个自转和锁步双源推帧 → 全局加速 + 事件时序错乱） */
  window.__pauseAuto = function () {
    if (L.phase === "running") return;
    L.phase = "running";
    stopTicker();
    try { if (window.__stopTicker) window.__stopTicker(); } catch (e) {}
  };

  function _tick() {
    if (L.phase === "running") { stopTicker(); return; }
    stepOnce();
  }
  function stopTicker() {
    if (_wTicker) { try { _wTicker.terminate(); } catch (e) {} _wTicker = null; }
    if (_wFallback) { clearInterval(_wFallback); _wFallback = null; }
  }
  try {
    var wsrc = "var t=null;onmessage=function(e){if(e.data==='start'){if(!t)t=setInterval(function(){postMessage(0)}," +
      Math.round(STEP) + ");}else if(e.data==='stop'){clearInterval(t);t=null;}};";
    _wTicker = new Worker(URL.createObjectURL(new Blob([wsrc], { type: "text/javascript" })));
    _wTicker.onmessage = _tick;
    _wTicker.postMessage("start");
  } catch (e) {
    _wFallback = setInterval(_tick, STEP);
  }
  window.__stopTicker = stopTicker;

  /* ============ ENTER_FRAME 监听器保活（B 路线根治补丁 v2） ============
   * 根因（已实测 + 反编译确认）：
   *   FightingGameMain.update / Controller.spaceCheck 以 useWeakReference=true
   *   把 ENTER_FRAME 注册到【对象级】(root/levelContainer)，AwayFl 的 JS 运行时
   *   在对象分配高峰（第二个怪/关卡节点）时丢失这些监听器——之后渲染循环照转、
   *   零异常、画面定格最后一帧、输入全死（实测确认）。
   * v2 修正：监听器在对象级而非 stage 单例（实测 stage 单例表恒为空），
   *   因此改为【原型级拦截】——hook 所有 EventDispatcher 共享的
   *   addEventListener/removeEventListener，按对象备份 enterFrame 注册；
   *   巡检发现某对象"曾有 enterFrame 监听器、现在没了"→ 自动恢复。 */
  (function () {
    /* 停用（见上）：该假设已被实测推翻（游戏不往 stage 单例注册 enterFrame，rescue 从未触发）；
     * 且在生产里重新注册已被移除的监听器会复活幽灵更新，风险大于收益。保留代码作历史记录。 */
    return;
    var EF = "enterFrame";
    var armed = false;
    var backup = new Map();   // target -> [{listener, capture, priority}]

    function tryInstall() {
      var pl = window.AVMPlayerPoki;
      if (!pl || !pl._avmHandler) return false;
      var pg = pl._avmHandler._playerglobal;
      var st = pg && pg._stage;
      var as3 = st && st._stage;
      if (!as3 || !as3.addEventListener || !as3.__proto__) return false;

      // EventDispatcher 原型（AS3 侧所有可派发对象共享）
      var proto = Object.getPrototypeOf(as3);
      if (!proto || !proto.addEventListener || proto.__efKeepAliveV2) return !proto.__efKeepAliveV2 ? false : true;
      if (proto.__efKeepAliveV2) return true;
      proto.__efKeepAliveV2 = true;

      var oAdd = proto.addEventListener;
      var oRem = proto.removeEventListener;

      proto.addEventListener = function (type, listener, useCapture, priority, useWeak) {
        try {
          if (String(type) === EF && typeof listener === "function") {
            var arr = backup.get(this) || [];
            if (!arr.some(function (b) { return b.listener === listener; })) {
              arr.push({ listener: listener, capture: !!useCapture, priority: priority || 0 });
              backup.set(this, arr);
            }
          }
        } catch (e) {}
        return oAdd.call(this, type, listener, useCapture, priority, useWeak);
      };

      proto.removeEventListener = function (type, listener, useCapture) {
        try {
          if (String(type) === EF) {
            var arr = backup.get(this);
            if (arr) {
              // 记录"被移除"——巡检器据此判断是否恢复
              arr.forEach(function (b) { if (b.listener === listener) b.removed = true; });
            }
          }
        } catch (e) {}
        return oRem.call(this, type, listener, useCapture);
      };

      // 巡检：对每个有备份的对象，若其监听表里已无 enterFrame 注册 → 恢复
      setInterval(function () {
        try {
          backup.forEach(function (arr, target) {
            if (!arr.length) return;
            var los = target._listenerObjects;
            if (!los) return;
            var hasEF = los.some(function (lo) { return String(lo.type) === EF; });
            if (!hasEF) {
              // 曾注册、现在没了 → 全部恢复（强引用）
              window.__efRescue = (window.__efRescue || 0) + 1;
              arr.forEach(function (b) {
                try { oAdd.call(target, EF, b.listener, b.capture, b.priority, false); } catch (e) {}
              });
            }
          });
        } catch (e) {}
      }, 500);

      return true;
    }

    // 等 AVM 就绪后武装（最长等 60s）
    var tries = 0;
    var arm = setInterval(function () {
      tries++;
      if (tryInstall()) {
        armed = true;
        clearInterval(arm);
        try { window.__efArmed = true; window.__efBackupSize = function(){ return backup.size; }; } catch (e) {}
      } else if (tries > 600) clearInterval(arm);
    }, 100);
    window.__efKeepAliveArmed = function () { return armed; };
  })();

  /* ---- 输入注入 ---- */
  var KEYCODE = {
    ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40,
    KeyW: 87, KeyA: 65, KeyS: 83, KeyD: 68,
    KeyN: 78, KeyM: 77, KeyG: 71, KeyH: 72,
    KeyI: 73, KeyK: 75, KeyJ: 74, KeyL: 76, KeyO: 79, KeyP: 80
  };
  var KEYNAME = {
    ArrowLeft: "ArrowLeft", ArrowUp: "ArrowUp", ArrowRight: "ArrowRight", ArrowDown: "ArrowDown",
    KeyW: "w", KeyA: "a", KeyS: "s", KeyD: "d",
    KeyN: "n", KeyM: "m", KeyG: "g", KeyH: "h",
    KeyI: "i", KeyK: "k", KeyJ: "j", KeyL: "l", KeyO: "o", KeyP: "p"
  };

  function fireKey(type, code) {
    var kc = KEYCODE[code];
    if (!kc) return;
    var ev = new KeyboardEvent(type, {
      key: KEYNAME[code], code: code, keyCode: kc, which: kc,
      bubbles: true, cancelable: true, composed: true
    });
    ev.__np = true;   // 我们自己的合成事件，放行
    [document, document.body, window].forEach(function (t) {
      try { t && t.dispatchEvent(ev); } catch (e) {}
    });
  }

  function canvas() {
    var cs = document.querySelectorAll("canvas");
    for (var i = 0; i < cs.length; i++) if (cs[i].width >= 400) return cs[i];
    return null;
  }

  function fireMouse(type, fx, fy) { if (!isFinite(fx) || !isFinite(fy)) return;
    var c = canvas();
    if (!c) return;
    var r = c.getBoundingClientRect();
    var dpr = (c.ownerDocument.defaultView && c.ownerDocument.defaultView.devicePixelRatio) || 1;
    var o = {
      clientX: Math.round(r.left + r.width * fx * dpr),
      clientY: Math.round(r.top + r.height * fy * dpr),
      bubbles: true, cancelable: true, composed: true, view: window,
      button: 0, buttons: (type === "pointerdown" || type === "mousedown") ? 1 : 0
    };
    var ev;
    try {
    if (type.indexOf("pointer") === 0) {
      o.pointerId = 1; o.pointerType = "mouse"; o.isPrimary = true;
      ev = new PointerEvent(type, o);
    } else {
      ev = new MouseEvent(type, o);
    }
    ev.__np = true;
    (c.parentElement || c).dispatchEvent(ev);   // 派发到 container 本体（AwayFL 监听处）
    } catch (e2) { try { L.replayErr = (L.replayErr || 0) + 1; } catch (e3) {} }
  }

  /* ---- PLAYER SELECT 的选择必须从原生点击里取 ----
   * 实测：房主的点击由 hostClick() 直接派发 PointerEvent/MouseEvent 到 canvas，
   * 好友的点击同样走原生派发，两者都不经过 applyEvents（那条路只有键盘）。
   * 所以在 iframe 内部监听原生按下，命中 num_players 时按左右面板记下 1/2 人。 */
  function noteModeFromNative(e) {
    try {
      var A0 = window.AVMPlayerPoki;
      if (!A0 || !A0._avmHandler) return;
      var r0 = A0._avmHandler._playerglobal._stage._stage.getChildAt(0);
      if (!r0 || r0.currentLabel !== "num_players") return;
      var c = canvas();
      if (!c) return;
      var rc = c.getBoundingClientRect();
      if (!rc.width) return;
      var fx = (e.clientX - rc.left) / rc.width;
      window.__deMode = (fx < 0.45) ? 1 : 2;
      window.__deModeFx = Math.round(fx * 1000) / 1000;
    } catch (e2) {}
  }
  document.addEventListener("pointerdown", noteModeFromNative, true);
  document.addEventListener("mousedown", noteModeFromNative, true);

  /* ---- 屏蔽原生输入：游戏只接受按帧注入的合成事件 ---- */
  function blockNative(type, flag) {
    window.addEventListener(type, function (e) {
      if (e.__np) return;
      e.stopImmediatePropagation();
      e.preventDefault();
    }, true);
    flag && 0;
  }
  var QS = new URLSearchParams(location.search);
  var AUTO = QS.has("auto");
  var NOBLOCK = QS.has("noblock") || AUTO;
  if (!NOBLOCK) {
    // 只拦键盘。鼠标不能拦：AVM 的命中判定依赖原生指针状态，
    // 拦截后哪怕合成事件能到 window，菜单也点不动。
    // 外层页面已用 pointer-events:none 挡住原生鼠标，游戏本来就收不到。
    ["keydown", "keyup", "keypress"].forEach(function (t) { blockNative(t); });
  }

  /* ---- 对外 API ---- */
  var hashCv = document.createElement("canvas");
  hashCv.width = 64; hashCv.height = 48;
  var hashCtx = hashCv.getContext("2d", { willReadFrequently: true });

  L.stepOnce = stepOnce;
  L.canvas = canvas;
  /* 画布像素尺寸固定为 880x640（16:11.6 ≈ 550:400），两端完全一致 */
  var CW = 880, CH = 640;
  function fitCanvas() {
    var c = canvas();
    if (!c) return false;
    L.scale = 1;
    return true;
  }
  L.fitCanvas = fitCanvas;
  L.setStarted = function () {
    if (L.started) return;
    L.started = true;
    L.frames = 0;
    L.phase = "ready";
    /* freeT 已由 Web Worker 节拍器取代（见上方），这里不再 clearInterval */
    fitCanvas();
    setTimeout(fitCanvas, 300);
    setTimeout(fitCanvas, 1200);
    if (AUTO) {
      // 自己玩的模式：就绪后自动跑 30fps，不依赖外部单步
      setInterval(function () { if (L.started) stepOnce(); }, 1000 / 30);
    }
  };
  window.addEventListener("resize", function () { setTimeout(fitCanvas, 80); });
  /* P2 的按键（P2 = 方向键移动 + N 攻击 / M 跳）。
   * 单人模式下必须屏蔽：FightingGameMain.as:546 是 `else if(Key.customDown(10)) p2Join();`，
   * 按到 P2 的键就会把青色斯巴达拉进来，并把 numPlayers 改成 2。 */
  var P2KEYS = { ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1, KeyN: 1, KeyM: 1 };

  /* 一次事件批量应用（同一帧内） */
  L.applyEvents = function (list) {
    L.evCount = (L.evCount || 0) + list.length;
    for (var q = 0; q < list.length; q++) if (list[q][0] === "md") L.clickApplied = (L.clickApplied || 0) + 1;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      /* 在 PLAYER SELECT 上点哪块面板，就是几玩家（单人也会被端口当成 3 人） */
      if (e[0] === "md") {
        try {
          var A0 = window.AVMPlayerPoki;
          var r0 = A0 && A0._avmHandler && A0._avmHandler._playerglobal._stage._stage.getChildAt(0);
          if (r0 && r0.currentLabel === "num_players") window.__deMode = (e[1] < 0.45) ? 1 : 2;
        } catch (e0) {}
      }
      /* 单人：丢掉 P2 按键，p2Join 就永远不会被触发 */
      if (window.__deMode === 1 && (e[0] === "d" || e[0] === "u") && P2KEYS[e[1]]) continue;
      if (e[0] === "d") fireKey("keydown", e[1]);
      else if (e[0] === "u") fireKey("keyup", e[1]);
      else if (e[0] === "md") {
        // 必须先移动一次：AVM 用"最后一次 mousemove"的坐标做命中判定，
        // 只发 down/up 会落在它记录的旧位置上，菜单永远点不动。
        fireMouse("pointermove", e[1], e[2]);
        fireMouse("mousemove", e[1], e[2]);
        fireMouse("pointerdown", e[1], e[2]);
        fireMouse("mousedown", e[1], e[2]);
      }
      else if (e[0] === "mu") fireMouse("pointerup", e[1], e[2]), fireMouse("mouseup", e[1], e[2]), fireMouse("click", e[1], e[2]);
    }
  };
  /* 画面哈希：step 之后取，位置固定，不存在采样相位问题 */
  L.hash = function () {
    var c = canvas();
    if (!c) return 0;
    try {
      hashCtx.drawImage(c, 0, 0, 64, 48);
      var d = hashCtx.getImageData(0, 0, 64, 48).data;
      var h = 2166136261;
      for (var i = 0; i < d.length; i += 4) {
        h ^= d[i] + (d[i + 1] << 3) + (d[i + 2] << 6);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    } catch (e) { return 0; }
  };

  window.__lock = L;

  /* ---- 远程同乐（nolock）：游戏进战斗时会调 window.__pauseAuto 想把帧权交给锁步，
   * 但本模式没有锁步接管 → 一旦停在自转上游戏就冻结。nolock 下让它变空操作，
   * 游戏永远用自转 Worker 跑（好友端是视频流，无需确定性）。 ---- */
  if (new URLSearchParams(location.search).has("nolock")) {
    window.__pauseAuto = function () {};
  window.__rafErrs = [];
  }

  /* ---- 静音音频保活：豁免 Chrome 后台节流 ----
   * 首次用户手势时启动 0 增益循环音频。Chrome 视标签为「正在播放音频」，
   * 完全豁免后台节流（切后台/同机多窗时 timer 不再降到 1Hz）。
   * 锁步联机下任何一端被节流，全房都要跟着等它——此保活是刚需。 */
  (function keepAlive() {
    var ctx = null;
    function start() {
      if (ctx) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        var buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); // 1 秒静音
        var src = ctx.createBufferSource();
        src.buffer = buf; src.loop = true;
        var gain = ctx.createGain(); gain.gain.value = 0;
        src.connect(gain); gain.connect(ctx.destination);
        src.start(0);
        document.removeEventListener("pointerdown", start);
        document.removeEventListener("keydown", start);
      } catch (e) {}
    }
    document.addEventListener("pointerdown", start);
    document.addEventListener("keydown", start);
  })();
})();
</script>

        get: function () { return dHref.get.call(this); },

})();

<script>
/* ── 根因修复：numPlayers 与实际玩家数不一致 ─────────────────────────
 * 实测（三人联机移植版）：在 PLAYER SELECT 选「2 PLAYERS」，进关后 numPlayers
 * 仍是 3，players 数组长度 3 但只填了 2 个槽位（只有 healthBar / healthBarP2）。
 * 于是 CPUCharacterFinal.as:420
 *      attackPlayer = Math.floor(Math.random() * numPlayers) + 1;   // 可能 = 3
 * 让 doAIMovement 去读 players[2] === undefined；AwayFl 读属性先取
 * Symbol(AX class marker)，所以每帧抛：
 *      TypeError: Cannot read properties of undefined (reading 'Symbol(AX class marker)')
 * 该异常从 AVM 的 enterFrame 分发里逃出去，AVM tick 内"分发之后"的渲染整段被跳过
 * → 画面永久定格（实测冻结时 WebGL 绘制 0 次/2 秒；健康时约 1.3 万次/2 秒）。
 *
 * 三层修复：
 *  1) 把 numPlayers 校正为真实玩家数（= 存在的玩家血条数，只降不升，避免影响单人）——
 *     异常从源头消失；
 *  2) 每 0.5 秒把所有敌人的 attackPlayer 夹回 [1, numPlayers] —— 兜底；
 *  3) 把 enterFrame 分发入口包 try/catch —— 最后一道防线：任何监听器异常都不再
 *     中断整个 tick，渲染永远不会被打断。
 * 实测：numPlayers 由 3 校正为 2 后，连续进攻 20 秒异常 0 次（此前约 30 次/秒），
 *       敌人/玩家/血条/渲染全部正常，无需牺牲任何敌人。
 */
(function () {
  var contained = 0, installed = 0, npFixed = 0;

  var deGame = null, deGameLabel = "";

  function deHas(o, name) {
    try { return o[name] !== undefined && o[name] !== null; } catch (e) { return false; }
  }

  function deFindGame(root) {
    var found = null, seen = new Set();
    (function walk(o, d) {
      if (!o || found || d > 8 || seen.has(o)) return;
      seen.add(o);
      if (deHas(o, "$BgtheGame")) { try { found = o.$BgtheGame; } catch (e) {} return; }
      var n = 0; try { n = o.numChildren || 0; } catch (e) {}
      for (var i = 0; i < n; i++) { var c = null; try { c = o.getChildAt(i); } catch (e) {} if (c) walk(c, d + 1); }
    })(root, 0);
    return found;
  }

  function deClampBaddies(game, lim) {
    var mid = null; try { mid = game.$BgmidLayer; } catch (e) {}
    if (!mid) return 0;
    var n = 0; try { n = mid.numChildren || 0; } catch (e) {}
    var fixed = 0;
    for (var i = 0; i < n; i++) {
      var c = null; try { c = mid.getChildAt(i); } catch (e) {}
      if (!c) continue;
      var ap = null; try { ap = c.$BgattackPlayer; } catch (e) { continue; }
      if (typeof ap === "number" && (ap < 1 || ap > lim)) { try { c.$BgattackPlayer = 1; fixed++; } catch (e) {} }
    }
    if (fixed) window.__npClamped = (window.__npClamped || 0) + fixed;
    return fixed;
  }

  function sweep() {
    var t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
    var A = window.AVMPlayerPoki;
    if (!A || !A._avmHandler) return;
    var pg = A._avmHandler._playerglobal;
    var root = pg && pg._stage && pg._stage._stage && pg._stage._stage.getChildAt(0);
    if (!root) return;

    /* 只在关卡切换时找一次 theGame，之后一直复用。
     * 原来每 500ms 全树走一遍 + getOwnPropertyNames + seen.indexOf（O(n²)），
     * 怪一多（每只怪又带十几个子节点）就成了肉眼可见的顿。 */
    var label = ""; try { label = root.currentLabel || ""; } catch (e) {}
    if (label !== deGameLabel) { deGame = null; deGameLabel = label; }
    if (label === "the_game" && !deGame) deGame = deFindGame(root);
    var game = deGame;
    var baddies = [];

    /* 1) 玩家数：以 PLAYER SELECT 的选择为准
     * 实测：单人模式进关后 numPlayers 也是 3，healthBarP2.alpha 被置 1，
     * 说明端口把人数写死成多人了。血条 MC 在时间轴上一直都在，不能用来数玩家。 */
    var mode = 0; try { mode = window.__deMode || 0; } catch (e) {}
    var bars = 0;
    ["healthBar", "healthBarP2", "healthBarP3", "healthBarP4"].forEach(function (n) {
      var v = null; try { v = root["$Bg" + n] || root[n]; } catch (e) {}
      if (v) bars++;
    });
    if (game) {
      var np = 0; try { np = game.$BgnumPlayers; } catch (e) {}
      var want = mode > 0 ? mode : 0;
      if (want && typeof np === "number" && np !== want) {
        try { game.$BgnumPlayers = want; npFixed++; window.__npNumPlayers = want; } catch (e) {}
        np = want;
      }
      /* 超出所选人数的玩家一律隐藏：这个移植是「3 人改版」，
       * 实测单人模式下 p3Character 依然存在（140,375 的青色斯巴达），
       * 还带着 p3Hud（右上那个 "P3 100"）。 */
      if (mode > 0) {
        for (var pk = 2; pk <= 3; pk++) {
          var ch = null; try { ch = game["$Bgp" + pk + "Character"]; } catch (e) {}
          var on = pk <= mode;
          if (ch) {
            try { if (ch.visible !== on) { ch.visible = on; window.__deHidden = (window.__deHidden || 0) + 1; } } catch (e) {}
          }
          var hb = null; try { hb = root["$BghealthBarP" + pk] || root["healthBarP" + pk]; } catch (e) {}
          if (hb) { try { if (hb.alpha !== (on ? 1 : 0)) hb.alpha = on ? 1 : 0; } catch (e) {} }
          var hud = null; try { hud = game["$Bgp" + pk + "Hud"]; } catch (e) {}
          if (hud) { try { hud.visible = on; } catch (e) {} }
          var sc = null; try { sc = root["$Bgp" + pk + "Score"] || root["p" + pk + "Score"]; } catch (e) {}
          if (sc) { try { sc.visible = on; } catch (e) {} }
          var lv = null; try { lv = root["$Bgp" + pk + "_lives"] || root["p" + pk + "_lives"]; } catch (e) {}
          if (lv) { try { lv.visible = on; } catch (e) {} }
        }
      }
    }

    /* 2) attackPlayer 夹回 [1, numPlayers]：直接扫 midLayer 的孩子，
     *    十几只怪而已，不再为了找怪遍历全树。 */
    if (game) {
      var lim = 2; try { lim = game.$BgnumPlayers || 2; } catch (e) {}
      if (lim < 1) lim = 1;
      deClampBaddies(game, lim);
    }

    var dt = (typeof performance !== "undefined" && performance.now) ? performance.now() - t0 : 0;
    var pf = window.__perfSweep || (window.__perfSweep = { n: 0, sum: 0, max: 0 });
    pf.n++; pf.sum += dt; if (dt > pf.max) pf.max = dt; pf.last = Math.round(dt * 100) / 100;
  }

  /* 3) 分发入口隔离 */
  function installGuard() {
    var A = window.AVMPlayerPoki;
    if (!A || !A._avmHandler) return;
    var pg2 = A._avmHandler._playerglobal;
    var st = pg2 && pg2._stage;
    if (!st) return;
    var orig = st.dispatchStaticBroadCastEvent;
    if (typeof orig !== "function" || orig.__npGuarded) return;
    var guarded = function (t) {
      try { return orig.call(this, t); }
      catch (e) {
        contained++;
        window.__npContained = contained;
        try {
          var log = window.__npContainedLog || (window.__npContainedLog = []);
          if (log.length < 20) log.push((e && e.stack) ? String(e.stack).slice(0, 800) : String(e));
        } catch (_) {}
        try { A._requestedRender = true; } catch (_) {}
        return undefined;
      }
    };
    guarded.__npGuarded = true;
    st.dispatchStaticBroadCastEvent = guarded;
    installed++;
  }

  window.__npGuardStatus = function () {
    return { installed: installed, contained: contained, npFixed: npFixed, np: window.__npNumPlayers };
  };

  installGuard(); sweep();
  setInterval(function () { installGuard(); sweep(); }, 500);
})();
</script>
